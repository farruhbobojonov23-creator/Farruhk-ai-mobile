<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>SHEF51 Visual Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #222;background:#080808}.brand{font-weight:900;letter-spacing:.12em;white-space:nowrap}.brand b{color:#ff3344}.pages{display:flex;gap:8px;overflow:auto;flex:1}.pageBtn,.btn{border:1px solid #303030;background:#141414;color:#eee;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.pageBtn.active,.btn.primary{background:#ff2e3f;border-color:#ff2e3f;color:#fff}.stage{display:grid;grid-template-columns:1fr 330px;min-height:0}.canvas{background:#111;min-width:0;position:relative}.canvas iframe{width:100%;height:100%;border:0;background:#fff}.side{background:#090909;border-left:1px solid #222;padding:16px;overflow:auto}.side h3{margin:4px 0 14px;font-size:20px}.muted{color:#929292;line-height:1.5}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#999}.field input,.field textarea{width:100%;background:#050505;border:1px solid #2b2b2b;color:#fff;border-radius:14px;padding:12px;font:inherit}.field textarea{min-height:100px}.photoBox{border:1px dashed #333;border-radius:16px;padding:12px}.bottom{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid #222;background:#080808}.grow{flex:1}.status{color:#9a9a9a}.ok{color:#55d187}.err{color:#ff7680}.hidden{display:none!important}
@media(max-width:840px){.stage{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:66px;max-height:46vh;z-index:20;border:1px solid #282828;border-radius:24px 24px 0 0;transform:translateY(calc(100% - 54px));transition:.2s;padding-top:10px}.side.open{transform:translateY(0)}.sideHandle{display:block!important;width:70px;height:5px;border-radius:99px;background:#333;margin:0 auto 10px}.top{height:auto;min-height:64px;align-items:flex-start;flex-wrap:wrap;padding:10px}.pages{order:2;width:100%}.bottom{padding-bottom:max(10px,env(safe-area-inset-bottom))}.bottom .status{display:none}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand"><b>SHEF51</b> · VISUAL EDITOR</div><div class="pages" id="pages">
<button class="pageBtn active" data-page="index.html">Главная</button><button class="pageBtn" data-page="products.html">Товары</button><button class="pageBtn" data-page="services.html">Услуги</button><button class="pageBtn" data-page="about.html">Обо мне</button><button class="pageBtn" data-page="book.html">Бронирование</button></div><button id="closeBtn" class="btn">Панель</button></header>
<main class="stage"><div class="canvas"><iframe id="frame" title="SHEF51 editor"></iframe></div><aside class="side" id="side"><div class="sideHandle hidden" id="sideHandle"></div><h3 id="sideTitle">Выбери элемент</h3><p class="muted" id="sideHint">Нажми на текст или фотографию прямо на сайте.</p><div id="textEditor" class="hidden"><div class="field"><label>Текст</label><textarea id="textValue"></textarea></div><button id="applyText" class="btn">Применить</button></div><div id="photoEditor" class="hidden"><div class="photoBox"><div class="field"><label>Новое фото</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"></div><div id="photoStatus" class="status"></div></div></div></aside></main>
<footer class="bottom"><button id="backAdmin" class="btn">Обычная админка</button><div class="grow"></div><span id="saveStatus" class="status"></span><button id="saveBtn" class="btn">Сохранить черновик</button><button id="publishBtn" class="btn primary">Опубликовать</button></footer>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let cfg={},menu=[],page='index.html',selectedKey=null,selectedPhoto=null;
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}
function getPath(obj,path){return path.split('.').reduce((o,k)=>o?.[k],obj)}
function setPath(obj,path,val){const a=path.split('.');let o=obj;for(let i=0;i<a.length-1;i++)o=o[a[i]]??={};o[a.at(-1)]=val}
function loadPage(p){page=p;$$('.pageBtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#frame').src='/api/shef51/admin/visual-page?page='+encodeURIComponent(p)+'&t='+Date.now();clearSelection()}
function clearSelection(){selectedKey=null;selectedPhoto=null;$('#sideTitle').textContent='Выбери элемент';$('#sideHint').textContent='Нажми на текст или фотографию прямо на сайте.';$('#textEditor').classList.add('hidden');$('#photoEditor').classList.add('hidden')}
function openSide(){if(innerWidth<=840)$('#side').classList.add('open')}
function selectText(key,text){selectedKey=key;selectedPhoto=null;$('#sideTitle').textContent='Редактирование текста';$('#sideHint').textContent=key;$('#textValue').value=getPath(cfg,key)??text??'';$('#textEditor').classList.remove('hidden');$('#photoEditor').classList.add('hidden');openSide()}
function selectPhoto(key){selectedKey=null;selectedPhoto=key;$('#sideTitle').textContent='Замена фотографии';$('#sideHint').textContent=key;$('#textEditor').classList.add('hidden');$('#photoEditor').classList.remove('hidden');openSide()}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='shef-select'){if(d.edit)selectText(d.edit,d.text);else if(d.photo)selectPhoto(d.photo)}else if(d.type==='shef-change'&&d.key){setPath(cfg,d.key,d.value);$('#textValue').value=d.value}else if(d.type==='shef-nav'&&d.page)loadPage(d.page)});
$('#applyText').onclick=()=>{if(!selectedKey)return;setPath(cfg,selectedKey,$('#textValue').value);const doc=$('#frame').contentDocument;const el=doc?.querySelector('[data-shef-edit="'+CSS.escape(selectedKey)+'"]');if(el)el.innerText=$('#textValue').value};
async function fileData(file){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(file)})}
$('#photoFile').onchange=async e=>{const f=e.target.files?.[0];if(!f||!selectedPhoto)return;const st=$('#photoStatus');if(f.size>8*1024*1024){st.textContent='Фото больше 8 МБ';st.className='status err';return}st.textContent='Загрузка…';try{const d=await api('/api/shef51/admin/upload',{method:'POST',body:JSON.stringify({name:selectedPhoto.replace(/\W+/g,'-'),data:await fileData(f)})});setPath(cfg,selectedPhoto,d.imageUrl);const doc=$('#frame').contentDocument;const img=doc?.querySelector('[data-shef-photo="'+CSS.escape(selectedPhoto)+'"]');if(img)img.src=location.origin+d.imageUrl+'?t='+Date.now();st.textContent='Фото заменено ✓';st.className='status ok'}catch(err){st.textContent=err.message;st.className='status err'}};
async function saveDraft(){const m=await api('/api/shef51/admin/menu',{method:'PUT',body:JSON.stringify({items:menu})});menu=m.items||menu;const c=await api('/api/shef51/admin/site-config',{method:'PUT',body:JSON.stringify({config:cfg})});cfg=c.config||cfg;$('#saveStatus').textContent='Черновик сохранён ✓';$('#saveStatus').className='status ok'}
$('#saveBtn').onclick=()=>saveDraft().catch(e=>{$('#saveStatus').textContent=e.message;$('#saveStatus').className='status err'});
$('#publishBtn').onclick=async()=>{try{await saveDraft();await api('/api/shef51/admin/publish',{method:'POST'});$('#saveStatus').textContent='Опубликовано ✓';$('#saveStatus').className='status ok'}catch(e){$('#saveStatus').textContent=e.message;$('#saveStatus').className='status err'}};
$$('.pageBtn').forEach(b=>b.onclick=()=>loadPage(b.dataset.page));
$('#closeBtn').onclick=()=>$('#side').classList.toggle('open');$('#sideHandle').onclick=()=>$('#side').classList.toggle('open');$('#backAdmin').onclick=()=>location.href='/shef51-admin';
(async()=>{try{const s=await api('/api/shef51/admin/session');if(!s.ok)return location.href='/shef51-admin';const [c,m]=await Promise.all([api('/api/shef51/admin/site-config'),api('/api/shef51/admin/menu')]);cfg=c.config||{};menu=m.items||[];loadPage('index.html')}catch{location.href='/shef51-admin'}})();
</script></body></html>
