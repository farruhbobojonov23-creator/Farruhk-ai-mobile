<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SHEF51 Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1040px,92%);margin:auto;padding:28px 0 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-weight:900;letter-spacing:.14em}.brand b{color:#ff3344}.pill,.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800}.pill{background:#151515;color:#aaa}.btn{background:#ff2e3f;color:#fff;cursor:pointer}.btn.alt{background:#171717;border:1px solid #333}.btn.danger{background:#2a0f13}.card{background:#0b0b0b;border:1px solid #1f1f1f;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 18px 50px #0006}.login{max-width:460px;margin:10vh auto}.login h1,.head h1{font:700 clamp(40px,8vw,72px)/.95 Georgia,serif;margin:8px 0 16px}.muted{color:#9b9b9b;line-height:1.6}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.12em}.field input,.field textarea,.field select{width:100%;background:#080808;border:1px solid #2a2a2a;color:#fff;border-radius:14px;padding:13px 14px;font:inherit}.field textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:160px 1fr;gap:18px}.photo{height:160px;background:#080808;border:1px dashed #303030;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.photo span{color:#666;text-align:center;padding:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.status{font-size:13px;color:#9b9b9b}.ok{color:#55d187}.err{color:#ff6f7a}.toolbar{position:sticky;bottom:12px;background:#0a0a0aee;border:1px solid #242424;border-radius:22px;padding:12px;display:flex;gap:10px;backdrop-filter:blur(16px);z-index:10}.hidden{display:none!important}.switch{display:flex;gap:8px;align-items:center}.switch input{width:20px;height:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}.photo{height:220px}.top{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}.toolbar .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="login card">
    <div class="brand"><b>SHEF51</b> · OWNER</div>
    <h1>Админ-панель</h1>
    <p class="muted">Закрытый доступ владельца. Здесь можно менять фото, названия, описание, порядок и видимость блюд.</p>
    <div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Введите пароль"></div>
    <div class="row"><button id="loginBtn" class="btn">Войти</button><span id="loginMsg" class="status"></span></div>
  </div>

  <div id="adminView" class="hidden">
    <div class="top">
      <div><div class="brand"><b>SHEF51</b> · ADMIN</div><div class="muted">Редактор меню</div></div>
      <div class="row"><span id="storageBadge" class="pill">Хранилище</span><button id="logoutBtn" class="btn alt">Выйти</button></div>
    </div>
    <div class="head"><h1>Товары</h1><p class="muted">Изменения увидят гости только после нажатия «Сохранить всё».</p></div>
    <div id="items"></div>
    <div class="toolbar">
      <button id="addBtn" class="btn alt">+ Добавить товар</button>
      <div class="grow"></div>
      <span id="saveMsg" class="status"></span>
      <button id="saveBtn" class="btn">Сохранить всё</button>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let menu=[];
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
  return data;
}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  $('#items').innerHTML=menu.map((x,i)=>`
  <section class="card" data-i="${i}">
    <div class="grid">
      <div>
        <div class="photo">${x.imageUrl?'<img src="'+esc(x.imageUrl)+'" alt="">':'<span>Фото не загружено</span>'}</div>
        <div class="field"><label>Фото</label><input class="photoInput" type="file" accept="image/jpeg,image/png,image/webp"></div>
        <div class="status uploadStatus"></div>
      </div>
      <div>
        <div class="row">
          <div class="field grow"><label>Название</label><input data-k="name" value="${esc(x.name)}"></div>
          <div class="field" style="min-width:150px"><label>Категория</label><select data-k="category">
            <option value="rolls" ${x.category==='rolls'?'selected':''}>Роллы</option>
            <option value="sushi" ${x.category==='sushi'?'selected':''}>Суши</option>
            <option value="wok" ${x.category==='wok'?'selected':''}>Воки</option>
          </select></div>
        </div>
        <div class="field"><label>Описание</label><textarea data-k="description">${esc(x.description)}</textarea></div>
        <div class="row">
          <div class="field grow"><label>Порция / цена</label><input data-k="portion" value="${esc(x.portion||'')}"></div>
          <div class="field" style="width:110px"><label>Порядок</label><input data-k="order" type="number" value="${Number(x.order)||0}"></div>
        </div>
        <div class="row">
          <label class="switch"><input data-k="visible" type="checkbox" ${x.visible!==false?'checked':''}> Показывать гостям</label>
          <div class="grow"></div>
          <button class="btn danger deleteBtn">Удалить</button>
        </div>
      </div>
    </div>
  </section>`).join('');

  document.querySelectorAll('.card[data-i]').forEach(card=>{
    const i=Number(card.dataset.i);
    card.querySelectorAll('[data-k]').forEach(el=>{
      const k=el.dataset.k;
      el.oninput=()=>{menu[i][k]=el.type==='checkbox'?el.checked:(k==='order'?Number(el.value):el.value)};
      el.onchange=el.oninput;
    });
    card.querySelector('.deleteBtn').onclick=()=>{if(confirm('Удалить эту позицию?')){menu.splice(i,1);render()}};
    card.querySelector('.photoInput').onchange=async e=>{
      const file=e.target.files?.[0]; if(!file)return;
      const st=card.querySelector('.uploadStatus');
      if(file.size>8*1024*1024){st.textContent='Файл больше 8 МБ';st.className='status err';return}
      st.textContent='Загрузка…';st.className='status';
      const reader=new FileReader();
      reader.onload=async()=>{
        try{
          const d=await api('/api/shef51/admin/upload',{method:'POST',body:JSON.stringify({name:menu[i].id||menu[i].name||'photo',data:reader.result})});
          menu[i].imageUrl=d.imageUrl;
          st.textContent='Фото загружено';st.className='status ok';render();
        }catch(err){st.textContent=err.message;st.className='status err'}
      };
      reader.readAsDataURL(file);
    };
  });
}
async function loadAdmin(){
  const d=await api('/api/shef51/admin/menu');
  menu=d.items||[];
  $('#storageBadge').textContent=d.storage==='render-postgres'?'Render Storage ✓':'Хранилище не подключено';
  render();
}
async function showState(){
  try{
    const s=await api('/api/shef51/admin/session');
    if(s.ok){$('#loginView').classList.add('hidden');$('#adminView').classList.remove('hidden');await loadAdmin()}
  }catch{}
}
$('#loginBtn').onclick=async()=>{
  $('#loginMsg').textContent='Проверяю…';
  try{
    await api('/api/shef51/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});
    $('#loginView').classList.add('hidden');$('#adminView').classList.remove('hidden');await loadAdmin();
  }catch(err){$('#loginMsg').textContent=err.message;$('#loginMsg').className='status err'}
};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logoutBtn').onclick=async()=>{await api('/api/shef51/admin/logout',{method:'POST'});location.reload()};
$('#addBtn').onclick=()=>{menu.push({id:'item-'+Date.now(),category:'rolls',name:'Новый товар',description:'',portion:'',visible:true,order:(menu.length+1)*10,imageUrl:''});render()};
$('#saveBtn').onclick=async()=>{
  $('#saveMsg').textContent='Сохраняю…';$('#saveMsg').className='status';
  try{
    const d=await api('/api/shef51/admin/menu',{method:'PUT',body:JSON.stringify({items:menu})});
    menu=d.items||menu;$('#saveMsg').textContent='Сохранено ✓';$('#saveMsg').className='status ok';render();
  }catch(err){$('#saveMsg').textContent=err.message;$('#saveMsg').className='status err'}
};
showState();
</script>
</body>
</html>
