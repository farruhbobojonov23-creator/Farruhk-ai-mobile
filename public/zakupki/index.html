<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/zakupki/manifest.webmanifest"><link rel="icon" href="/zakupki/icon.svg" type="image/svg+xml">
<title>Суши Бери — Закупки</title>
<style>
:root{font:15px system-ui,-apple-system,Segoe UI;color:#f7f7fa;background:#0d0f14}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#3b111b,#0d0f14 52%)}.wrap{max-width:820px;margin:auto;padding:18px 15px 84px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:950;letter-spacing:2px;color:#ff6078;font-size:12px}h1{font-size:29px;margin:7px 0 2px}.muted,small,p{color:#aaaebe}.box{background:#191b22;border:1px solid #31343d;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 18px 50px #0005}.tabs,.actions{display:flex;gap:8px;overflow:auto;flex-wrap:wrap}.btn,select,input{font:inherit;border-radius:12px;padding:12px;background:#262933;color:#fff;border:1px solid #414550}.btn{font-weight:800;cursor:pointer}.btn.active,.btn.red{background:#e73b56;border-color:#e73b56}input,select{width:100%;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{display:grid;gap:6px;font-size:12px;color:#b5b9c5}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #32353f}.line:last-child{border:0}.hidden{display:none!important}.message{min-height:22px;color:#ffadbb;margin-top:10px}.login{max-width:430px;margin:10vh auto}.install{white-space:nowrap}@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:25px}.wrap{padding-top:12px}}</style>
</head><body><main class="wrap">
<section id="login" class="login"><div class="box"><div class="brand">СУШИ БЕРИ</div><h1>Закупки</h1><p>Внутренняя система заявок 4 точек.</p><label class="muted">Код доступа</label><input id="code" inputmode="numeric" autocomplete="off" placeholder="Введите код"><div class="actions" style="margin-top:12px"><button id="enter" class="btn red">Войти</button></div><div id="loginMsg" class="message"></div></div></section>
<section id="app" class="hidden"><header><div><div class="brand">СУШИ БЕРИ / PROCUREMENT</div><h1>Заявки на продукты</h1><small>4 точки · свод по поставщикам</small></div><button id="install" class="btn install hidden">Установить</button></header>
<nav id="tabs" class="tabs"></nav>
<section id="entry"><div class="box"><h2 id="title">Заявка точки</h2><div class="grid">
<label>Поставщик<select id="supplier"><option value="1">Алиди</option><option value="2">Шанхай</option></select></label>
<label>Товар<input id="name" maxlength="100" placeholder="Например, лосось"></label>
<label>Количество<input type="number" id="qty" min="0.001" step="0.001" placeholder="10"></label>
<label>Единица<select id="unit"><option>кг</option><option>шт</option><option>л</option><option>уп</option><option>г</option><option>кор</option></select></label>
</div><div class="actions" style="margin-top:14px"><button class="btn red" id="add">Добавить</button><button class="btn" id="submit">Передать на проверку</button></div><div id="entryMsg" class="message"></div></div>
<div class="box"><h2>Текущая заявка</h2><div id="items"></div></div></section>
<section id="admin" class="hidden"><div class="box"><h2>Свод поставщику</h2><div class="tabs"><button id="s1" class="btn active">Алиди</button><button id="s2" class="btn">Шанхай</button></div><div id="summary"></div><div class="actions" style="margin-top:14px"><button id="share" class="btn red">Поделиться заказом</button><button id="copy" class="btn">Скопировать</button></div><div id="adminMsg" class="message"></div></div></section>
<div class="actions"><button id="logout" class="btn">Выйти</button></div></section>
</main><script>
const el=id=>document.getElementById(id);let code=localStorage.getItem('sb_access')||'',me=null,orders=[],branch='1',supplier='1',view='entry',deferredPrompt=null;
const q=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:3});const headers=()=>({'Content-Type':'application/json','x-access-code':code});const msg=(id,s)=>el(id).textContent=s;
async function api(path,method='GET',data){const r=await fetch('/api/procurement/'+path,{method,headers:headers(),body:data?JSON.stringify(data):undefined});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Ошибка '+r.status);return b}
function row(name,right,click){const d=document.createElement('div');d.className='line';const a=document.createElement('span');a.textContent=name;const b=document.createElement(click?'button':'strong');b.className=click?'btn':'';b.textContent=right;if(click)b.onclick=click;d.append(a,b);return d}
async function login(){code=el('code').value.trim()||code;if(!code)return msg('loginMsg','Введите код');try{me=await api('me');localStorage.setItem('sb_access',code);el('login').classList.add('hidden');el('app').classList.remove('hidden');branch=me.admin?'1':me.branches[0];await reload()}catch(e){msg('loginMsg',e.message)}}
async function reload(){orders=await api('orders');await render()}
async function render(){const names={'1':'Плазма','2':'П/З 43/1','3':'Баумана 18','4':'ГС 33А'};const tabs=el('tabs');tabs.replaceChildren();const list=me.admin?['1','2','3','4']:me.branches;for(const b of list){const bt=document.createElement('button');bt.className='btn '+(view==='entry'&&branch===b?'active':'');bt.textContent=names[b];bt.onclick=()=>{branch=b;view='entry';render()};tabs.append(bt)}if(me.admin){const bt=document.createElement('button');bt.className='btn '+(view==='admin'?'active':'');bt.textContent='Поставщики';bt.onclick=()=>{view='admin';render()};tabs.append(bt)}el('entry').classList.toggle('hidden',view!=='entry');el('admin').classList.toggle('hidden',view!=='admin');el('title').textContent='Заявка · '+names[branch];el('items').replaceChildren();const own=orders.filter(x=>x.branch===branch);for(const o of own){const txt=o.name+' · '+q(o.qty)+' '+o.unit+' · '+(o.supplier==='1'?'Алиди':'Шанхай');el('items').append(row(txt,o.status==='draft'?'Удалить':o.status,o.status==='draft'?async()=>{await api('orders/'+o.id,'DELETE');await reload()}:null))}if(!own.length)el('items').textContent='Пока нет позиций';if(view==='admin')await loadSummary()}
async function loadSummary(){el('s1').classList.toggle('active',supplier==='1');el('s2').classList.toggle('active',supplier==='2');const list=await api('summary?supplier='+supplier);el('summary').replaceChildren();for(const x of list)el('summary').append(row(x.name,q(x.qty)+' '+x.unit));if(!list.length)el('summary').textContent='Нет переданных заявок';return list}
function summaryText(ls){return 'СУШИ БЕРИ — '+(supplier==='1'?'АЛИДИ':'ШАНХАЙ')+'\n\n'+ls.map(x=>x.name+' — '+q(x.qty)+' '+x.unit).join('\n')}
el('enter').onclick=login;el('code').onkeydown=e=>{if(e.key==='Enter')login()};el('logout').onclick=()=>{localStorage.removeItem('sb_access');location.reload()};
el('add').onclick=async()=>{try{const name=el('name').value.trim(),qty=Number(el('qty').value);await api('orders','POST',{branch,supplier:el('supplier').value,name,qty,unit:el('unit').value});el('name').value='';el('qty').value='';msg('entryMsg','Добавлено');await reload()}catch(e){msg('entryMsg',e.message)}};
el('submit').onclick=async()=>{if(!confirm('Передать заявку на проверку?'))return;try{const r=await api('submit','POST',{branch});msg('entryMsg','Передано: '+r.count);await reload()}catch(e){msg('entryMsg',e.message)}};
['1','2'].forEach(s=>el('s'+s).onclick=async()=>{supplier=s;await loadSummary()});
el('copy').onclick=async()=>{try{const ls=await loadSummary();await navigator.clipboard.writeText(summaryText(ls));msg('adminMsg','Скопировано')}catch(e){msg('adminMsg','Не удалось скопировать')}};
el('share').onclick=async()=>{try{const ls=await loadSummary();if(!ls.length)return;const text=summaryText(ls);if(navigator.share)await navigator.share({title:'Заказ поставщику',text});else await navigator.clipboard.writeText(text);await api('finalize','POST',{supplier});msg('adminMsg','Заказ сформирован и отмечен отправленным');await reload()}catch(e){if(e.name!=='AbortError')msg('adminMsg',e.message)}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;el('install').classList.remove('hidden')});el('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;el('install').classList.add('hidden')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/zakupki/sw.js');if(code){el('code').value=code;login()}
</script></body></html>
