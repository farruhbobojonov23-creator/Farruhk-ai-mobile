<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SHEF51 — Вход в панель</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif;padding:20px}.card{width:min(440px,100%);background:#0b0b0b;border:1px solid #242424;border-radius:28px;padding:26px}.brand{font-weight:900;letter-spacing:.14em}.brand b{color:#ff3045}h1{font:700 46px/.95 Georgia,serif;margin:16px 0 10px}.muted{color:#929292;line-height:1.5}.field{display:grid;gap:8px;margin:22px 0}.field label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.11em}.field input{width:100%;background:#070707;border:1px solid #303030;color:#fff;border-radius:15px;padding:15px;font:inherit}.btn{width:100%;border:0;border-radius:999px;padding:14px 18px;background:#ff3045;color:#fff;font-weight:900;font-size:16px}.err{background:#2a0c11;border:1px solid #4a151e;color:#ff98a2;padding:12px 14px;border-radius:14px;margin-top:14px}
</style>
</head>
<body>
<form class="card" method="post" action="/shef51-panel-login">
  <div class="brand"><b>SHEF51</b> · OWNER</div>
  <h1>Вход</h1>
  <p class="muted">Новая панель управления SHEF51.</p>
  <div class="field"><label>Пароль</label><input name="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus></div>
  <button class="btn" type="submit">Войти</button>
  <!--LOGIN_ERROR-->
</form>
</body>
</html>
