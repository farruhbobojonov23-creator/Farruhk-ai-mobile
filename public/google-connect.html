<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Подключение Google · Farukh AI</title>
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#eff2f7;color:#303448;font:16px/1.6 system-ui,sans-serif}main{margin:20px;padding:30px;max-width:470px;border-radius:24px;background:white;box-shadow:0 12px 40px #40496910}h1{font-size:25px;line-height:1.3}a,button{display:inline-block;border:0;border-radius:12px;padding:12px 18px;background:#745faa;color:white;text-decoration:none;font:inherit;cursor:pointer}[hidden]{display:none}.small{font-size:13px;color:#646b81}</style></head>
<body><main><h1 id="title">Подключение Google</h1><p id="status" role="status">Проверяю подключение…</p><button id="retry" hidden>Повторить</button><a id="continue" href="/#recipes" hidden>Открыть техкарты</a><p class="small">Настройка действует в этом браузере. Сохранённые техкарты и другие данные сохраняются.</p></main>
<script type="module">
import {DeviceStore} from '/device-store.js';
const parameters=new URLSearchParams(location.hash.slice(1));
const endpoint=parameters.get('endpoint')||'',key=parameters.get('key')||'';
history.replaceState(null,'',location.pathname);
const status=document.getElementById('status'),retry=document.getElementById('retry'),next=document.getElementById('continue');
function validEndpoint(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='script.google.com'&&!u.username&&!u.password&&!u.port&&!u.search&&!u.hash&&/^\/macros\/s\/[A-Za-z0-9_-]{15,}\/exec$/.test(u.pathname)}catch{return false}}
async function connect(){
 retry.hidden=true;next.hidden=true;
 if(!validEndpoint(endpoint)||key.length<24||key.length>200){status.textContent='В ссылке нет данных подключения. Открой личную ссылку из чата целиком.';return}
 try{
  status.textContent='Проверяю доступ к Google Документу…';
  const store=new DeviceStore();await store.load();
  const response=await fetch('/api/recipes/google-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint,key,action:'check'}),signal:AbortSignal.timeout(110000)});
  const data=await response.json();if(!response.ok||data.ok!==true)throw Error(data.error||'Google не подтвердил подключение.');
  await store.mutate(state=>{const previous=state.googleSync;state.googleSync={endpoint,key,enabled:true,documentUrl:data.documentUrl};if(previous?.endpoint!==endpoint||previous?.key!==key)state.googleDelivery={}});
  const saved=await store.load();if(saved.googleSync?.endpoint!==endpoint||saved.googleSync?.key!==key||!saved.googleSync.enabled)throw Error('Не удалось проверить сохранённое подключение.');
  document.getElementById('title').textContent='Google подключён';
  status.textContent='Автосохранение включено в этом браузере. Нажми «Открыть техкарты»: сохранённые готовые ТТК будут отправлены автоматически.';
  next.hidden=false;
 }catch(error){status.textContent='Подключение не завершено: '+error.message;retry.hidden=false}
}
retry.onclick=connect;connect();
</script></body></html>
