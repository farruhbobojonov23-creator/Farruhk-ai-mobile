plugins { id 'com.android.application' }
android {
  namespace 'com.farukh.revision'
  compileSdk 35
  defaultConfig {
    applicationId 'com.farukh.revision'
    minSdk 26
    targetSdk 35
    versionCode 21
    versionName '0.5.0'
  }
  buildTypes {
    // A separate APK for safe visual testing. Never overwrites the user's existing app.
    debug {
      applicationIdSuffix '.test'
      manifestPlaceholders = [appLabel: 'REVISION DEV TEST']
    }
    release {
      minifyEnabled false
      shrinkResources false
      manifestPlaceholders = [appLabel: 'FARUKH REVISION PRO']
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
