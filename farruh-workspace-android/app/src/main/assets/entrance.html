<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: file:; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>*{box-sizing:border-box}body{margin:0;background:#f6ecdd;font:16px system-ui}#hubSplash{position:fixed;inset:0;display:grid;place-items:center}
#hubSplash{background:radial-gradient(ellipse at 35% 20%,#fff9ef,#f4eadb 67%,#eee1cf);color:#483424;animation:porcelainFailsafe 12s step-end forwards}
#hubSplash .pc-layout{width:min(84vw,390px);height:min(84%,750px);display:grid;grid-template-rows:minmax(0,1.35fr) auto minmax(0,.9fr) auto;align-items:center;justify-items:center;gap:min(1.8vh,14px);margin-bottom:42px}
.pc-mark{width:100%;height:100%;object-fit:contain;animation:pcReveal 2.5s ease-out both}
@keyframes pcReveal{from{transform:scale(1.14)}to{transform:scale(1)}}
.pc-name{text-align:center;height:2.2em;font:clamp(24px,5.8vw,39px)/1 Georgia,serif;letter-spacing:.14em}
.pc-name small{display:block;margin-top:8px;font:600 11px/1.2 system-ui;letter-spacing:.24em}
.pc-dial{width:auto;height:100%;max-width:35vw;max-height:130px;overflow:visible}.pc-dial text{stroke:none;fill:#493423;font-family:Georgia,serif}
.pc-steps{list-style:none;width:100%;padding:0;margin:0}.pc-steps li{display:grid;grid-template-columns:24px 1fr 16px;align-items:center;gap:7px;min-height:clamp(30px,5vh,42px);border-bottom:1px solid #d4c3aa;text-align:left;font:500 clamp(13px,3.5vw,17px)/1.25 system-ui}
.pc-steps small,.pc-steps b{color:#8a632f;font-size:12px}.pc-steps b{visibility:hidden}.pc-steps li.done b{visibility:visible}
#hubSkipSplash{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-height:44px;border:0;background:#f6ecdc;color:#644a31;padding:0 16px;border-radius:22px;font:inherit}
#hubSplash{animation:none} #hubSkipSplash{cursor:pointer}</style><div id="hubSplash" class="hub-splash" role="dialog" aria-label="Заставка FARRUH WORKSPACE PRO">
 <div class="pc-layout" aria-hidden="true"><img class="pc-mark" src="porcelain-mark-hq.svg" alt=""><div class="pc-name"><span></span><small></small></div>
<svg class="pc-dial" viewBox="0 0 120 120"><circle cx="60" cy="60" r="57" fill="none" stroke="#bfa682" stroke-width="2" stroke-dasharray="0.7 5.27"/><circle cx="60" cy="60" r="50" fill="none" stroke="#d6c6ac"/>
<circle class="pc-arc" cx="60" cy="60" r="50" fill="none" stroke="#a47940" stroke-width="2.2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 60 60)"/>
<text x="60" y="62" text-anchor="middle" font-size="25">0%</text><text x="60" y="77" text-anchor="middle" font-size="6" letter-spacing="1">ЗАГРУЗКА</text></svg><ol class="pc-steps"><li><small>01</small><span data-label="Подготовка интерфейса"></span><b>✓</b></li><li><small>02</small><span data-label="Загрузка разделов"></span><b>✓</b></li><li><small>03</small><span data-label="Открытие рабочего экрана"></span><b>✓</b></li></ol></div>
 <button type="button" id="hubSkipSplash">Перейти к работе →</button>
</div>
<script>
const splash=document.querySelector('#hubSplash');
 const title=splash.querySelector('.pc-name span'), sub=splash.querySelector('.pc-name small');
 const percent=splash.querySelector('.pc-dial text'), arc=splash.querySelector('.pc-arc');
 const rows=Array.from(splash.querySelectorAll('[data-label]'));
 const start=performance.now();
 let frame,done=false;
 
 function write(el,text,length){
  const next=text.slice(0,Math.max(0,Math.floor(length)));
  if(el.textContent!==next)el.textContent=next;
 }
 function paint(now){
  const t=(now-start)/1000,v=Math.min(1,t/4.8),progress=v*v*(3-2*v)*100;
  percent.textContent=Math.round(progress)+'%';arc.setAttribute('stroke-dashoffset',100-progress);
  write(title,'FARRUH',t*5.3);write(sub,'WORKSPACE PRO',(t-.9)*12.5);
  rows.forEach((el,i)=>{
   const elapsed=t-.38-i*1.3;
   write(el,el.dataset.label,elapsed*26+1);
   el.parentElement.classList.toggle('done',elapsed>=1.12);
  });
  if(!done&&v<1)frame=requestAnimationFrame(paint);
 }
frame=requestAnimationFrame(paint);
document.querySelector('#hubSkipSplash').onclick=()=>{location.href='workspace-intro://skip'};
</script></html>
