plugins { id 'com.android.application' }
android {
  namespace 'ai.farukh.workspace'
  compileSdk 35
  defaultConfig {
    applicationId 'ai.farukh.workspace'
    minSdk 29
    targetSdk 35
    versionCode 7
    versionName '1.3.3'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  signingConfigs {
    release {
      def ks = System.getenv('WORKSPACE_KEYSTORE_PATH')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('WORKSPACE_STORE_PASS')
        keyAlias System.getenv('WORKSPACE_KEY_ALIAS')
        keyPassword System.getenv('WORKSPACE_KEY_PASS')
      }
    }
  }
  buildTypes {
    debug { minifyEnabled false }
    release {
      minifyEnabled false
      if (System.getenv('WORKSPACE_KEYSTORE_PATH')) signingConfig signingConfigs.release
    }
  }
}
