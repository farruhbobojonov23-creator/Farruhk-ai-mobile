name: FARUKH SUPPLY White Premium test APK
on:
  push:
    branches: ['feature/farukh-supply-simple-white', 'feature/farukh-supply-premium-pro', 'feature/supply-offline-layout-core']
    paths:
      # Web-only updates are signed and published by farukh-supply-white-qa.yml.
      # Keep the native OCR APK/version unchanged for these changes.
      - 'supply-android/**'
      - '!supply-android/app/src/main/assets/index.html'
      - '!supply-android/app/src/main/assets/app.js'
      - '!supply-android/app/src/main/assets/analytics.js'
      - '!supply-android/app/src/main/assets/invoice-parser.js'
      - '!supply-android/app/src/main/assets/web-version.txt'
      - 'supply/layout-*.js'
      - 'ocr-mobile-lab/**'
      - '.github/workflows/farukh-supply-white-test.yml'
concurrency:
  group: ${{ github.ref_name == 'feature/supply-offline-layout-core' && 'supply-offline-layout-test' || 'farukh-supply-white-test' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PaddlePaddle/PaddleOCR
          ref: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
          path: upstream-paddle
          persist-credentials: false
          sparse-checkout: deploy/ppocr-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/supply-android-tools.zip
              unzip -q /tmp/supply-android-tools.zip -d /tmp/supply-android-tools
              sudo mkdir -p "$SDK_ROOT/cmdline-tools/latest"
              sudo cp -R /tmp/supply-android-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
            yes | sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/supply-android-user"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/supply-android-user" >> "$GITHUB_ENV"
      - name: Test price analytics
        run: node --test supply/analytics.test.js supply/invoice-parser.test.js supply/product-catalog.test.js
      - name: Verify offline geometry regression tests
        if: github.ref_name == 'feature/supply-offline-layout-core' || github.ref_name == 'feature/farukh-supply-premium-pro'
        run: node --test supply/layout-core.test.js supply/layout-detector.test.js
      - name: Check preview JavaScript
        run: |
          node --check supply-android/app/src/main/assets/app.js
          node --check supply-android/app/src/main/assets/analytics.js
          node --check supply-android/app/src/main/assets/invoice-parser.js
      - name: Include offline Russian and English OCR models
        run: |
          set -e
          dest=supply-android/app/src/main/assets/tessdata
          mkdir -p "$dest"
          for lang in rus eng; do
            curl --retry 3 -fsSL "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/4.1.0/$lang.traineddata" -o "$dest/$lang.traineddata"
            test "$(wc -c < "$dest/$lang.traineddata")" -gt 100000
          done
          curl --retry 3 -fsSL https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/4.1.0/LICENSE -o "$dest/LICENSE"
      - name: Build offline Paddle SDK and Android test
        run: |
          set -euo pipefail
          base=upstream-paddle/deploy/ppocr-android
          bash ocr-mobile-lab/prepare.sh "$base"
          cp ocr-mobile-lab/SupplyPaddleBridge.kt "$base/ppocr-sdk/src/main/java/com/paddle/ocr/"
          cp ocr-mobile-lab/SupplyInvoiceSmokeTest.kt "$base/ppocr-sdk/src/androidTest/java/com/paddle/ocr/benchmark/"
          sed -i '/maven.aliyun.com/d' "$base/settings.gradle.kts"
          sed -i 's/opencv = "4.5.3"/opencv = "4.10.0"/; s/group = "com.quickbirdstudios", name = "opencv"/group = "org.opencv", name = "opencv"/' "$base/gradle/libs.versions.toml"
          gradle -p "$base" :ppocr-sdk:assembleRelease :ppocr-sdk:assembleDebugAndroidTest --no-daemon
          mkdir -p supply-android/app/libs
          cp "$base/ppocr-sdk/build/outputs/aar/ppocr-sdk-release.aar" supply-android/app/libs/supply-paddle.aar
      - name: Build test APK
        run: gradle -p supply-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FARUKH-SUPPLY-AI-preview
          path: supply-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate publication on offline Android OCR smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p upstream-paddle/deploy/ppocr-android :ppocr-sdk:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.paddle.ocr.benchmark.SupplyInvoiceSmokeTest --no-daemon
            gradle -p supply-android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.farukh.supply.InvoiceOrientationTest --no-daemon
      - name: Build signed test APK if signing is configured
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FARUKH_SUPPLY_SIGNING_BUNDLE }}
          STORE_B64: ${{ secrets.FARUKH_SUPPLY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_BUNDLE" ]; then
            STORE_B64=$(jq -er .keystore <<< "$SIGNING_BUNDLE")
            STORE_PASS=$(jq -er .password <<< "$SIGNING_BUNDLE")
            KEY_ALIAS=$(jq -er .alias <<< "$SIGNING_BUNDLE")
            KEY_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$STORE_B64"
            export STORE_PASS KEY_PASS
            unset SIGNING_BUNDLE
          fi
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice::Signing unavailable; only debug test APK exists."
            exit 0
          fi
          key="$RUNNER_TEMP/supply-test.jks"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$key"
          gradle -p supply-android :app:assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/supply-white-test"
          out="$RUNNER_TEMP/supply-white-test/FARUKH-SUPPLY-WHITE-TEST.apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "$out" supply-android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: FARUKH-SUPPLY-WHITE-signed-test
          path: ${{ runner.temp }}/supply-white-test/*.apk
          if-no-files-found: warn

      - name: Publish tested native OCR speed upgrade
        if: github.ref == 'refs/heads/feature/farukh-supply-simple-white'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_BUNDLE: ${{ secrets.FARUKH_SUPPLY_SIGNING_BUNDLE }}
          STORE_B64: ${{ secrets.FARUKH_SUPPLY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(awk '/versionCode / {print $2;exit}' supply-android/app/build.gradle)
          test "$code" = 13 || { echo "No approved native upgrade"; exit 0; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-simple-white" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA" || { echo "Superseded native build"; exit 0; }
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          tag=farukh-supply-current
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --output "$out/previous.json"
          old=$(jq -er .versionCode "$out/previous.json")
          if [ "$old" -ge "$code" ]; then echo "Native upgrade already published"; exit 0; fi
          test "$old" = 12
          test "$(jq -er .package "$out/previous.json")" = ai.farukh.supply
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --output "$out/previous-web.json"
          jq -er .payload "$out/previous-web.json" | base64 -d > "$out/previous-payload.json"
          webroot=supply-android/app/src/main/assets
          revision=$(tr -d '[:space:]' < "$webroot/web-version.txt")
          test "$revision" -ge "$(jq -er .revision "$out/previous-payload.json")"
          apk="FARUKH-SUPPLY-$code.apk"
          cp "$RUNNER_TEMP/supply-white-test/FARUKH-SUPPLY-WHITE-TEST.apk" "$out/$apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose "$out/$apk"
          cert=$("$signer" verify --print-certs "$out/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$cert" = "$(jq -er .cert "$out/previous.json")"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out/$apk" > "$out/badging.txt"
          grep -F "package: name='ai.farukh.supply' versionCode='13'" "$out/badging.txt"
          hash=$(sha256sum "$out/$apk" | cut -d' ' -f1)
          jq -n --arg file "$apk" --arg sha256 "$hash" --arg cert "$cert" --argjson versionCode "$code" '{package:"ai.farukh.supply",file:$file,sha256:$sha256,cert:$cert,versionCode:$versionCode}' > "$out/update.json"
          if [ -n "$SIGNING_BUNDLE" ]; then
            STORE_B64=$(jq -er .keystore <<< "$SIGNING_BUNDLE")
            STORE_PASS=$(jq -er .password <<< "$SIGNING_BUNDLE")
            KEY_ALIAS=$(jq -er .alias <<< "$SIGNING_BUNDLE")
            KEY_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$STORE_B64"
            export STORE_PASS KEY_PASS
            unset SIGNING_BUNDLE
          fi
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$out/key.jks"
          python3 - "$webroot" "$code" "$revision" "$out/payload.json" <<'PY'
          import base64,json,pathlib,sys
          root,code,rev,out=sys.argv[1:]
          names=['index.html','app.js','analytics.js','invoice-parser.js']
          files={n:base64.b64encode((pathlib.Path(root)/n).read_bytes()).decode('ascii') for n in names}
          pathlib.Path(out).write_text(json.dumps({'package':'ai.farukh.supply','nativeVersion':int(code),'revision':int(rev),'files':files},separators=(',',':')),encoding='utf-8')
          PY
          java supply-android/SignWeb.java "$out/key.jks" "$KEY_ALIAS" "$out/payload.json" "$out/web-current.json" "$cert" "$revision"
          test "$(wc -c < "$out/web-current.json")" -lt 1048576
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-simple-white" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
          gh release upload "$tag" "$out/$apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --output "$out/verified.apk"
          test "$(sha256sum "$out/verified.apk" | cut -d' ' -f1)" = "$hash"
          gh release upload "$tag" "$out/web-current.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --output "$out/verified-web.json"
          cmp "$out/web-current.json" "$out/verified-web.json"
          gh release upload "$tag" "$out/update.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --output "$out/verified-manifest.json"
          cmp "$out/update.json" "$out/verified-manifest.json"
          echo "Published and verified native upgrade $code with embedded web revision $revision."

      - name: Publish approved spatial OCR Android 15 upgrade
        if: github.ref == 'refs/heads/feature/farukh-supply-premium-pro'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_BUNDLE: ${{ secrets.FARUKH_SUPPLY_SIGNING_BUNDLE }}
          STORE_B64: ${{ secrets.FARUKH_SUPPLY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(awk '/versionCode / {print $2;exit}' supply-android/app/build.gradle)
          test "$code" = 15 || { echo "No approved native upgrade"; exit 0; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-premium-pro" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA" || { echo "Superseded native build"; exit 0; }
          # Require successful mobile UI QA for this exact commit before publishing.
          gate=""
          for attempt in $(seq 1 36); do
            gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/farukh-supply-white-qa.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else "" end')
            if [ "$gate" = success ]; then break; fi
            if [ -n "$gate" ] && [ "$gate" != null ]; then echo "Mobile QA gate failed: $gate"; exit 1; fi
            sleep 10
          done
          test "$gate" = success
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          tag=farukh-supply-current
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --output "$out/previous.json"
          old=$(jq -er .versionCode "$out/previous.json")
          if [ "$old" -ge "$code" ]; then echo "Native upgrade already published"; exit 0; fi
          test "$old" = 14
          test "$(jq -er .package "$out/previous.json")" = ai.farukh.supply
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --output "$out/previous-web.json"
          jq -er .payload "$out/previous-web.json" | base64 -d > "$out/previous-payload.json"
          webroot=supply-android/app/src/main/assets
          revision=$(tr -d '[:space:]' < "$webroot/web-version.txt")
          test "$revision" -ge "$(jq -er .revision "$out/previous-payload.json")"
          apk="FARUKH-SUPPLY-$code.apk"
          cp "$RUNNER_TEMP/supply-white-test/FARUKH-SUPPLY-WHITE-TEST.apk" "$out/$apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose "$out/$apk"
          cert=$("$signer" verify --print-certs "$out/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$cert" = "$(jq -er .cert "$out/previous.json")"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out/$apk" > "$out/badging.txt"
          grep -F "package: name='ai.farukh.supply' versionCode='15'" "$out/badging.txt"
          hash=$(sha256sum "$out/$apk" | cut -d' ' -f1)
          jq -n --arg file "$apk" --arg sha256 "$hash" --arg cert "$cert" --argjson versionCode "$code" '{package:"ai.farukh.supply",file:$file,sha256:$sha256,cert:$cert,versionCode:$versionCode}' > "$out/update.json"
          if [ -n "$SIGNING_BUNDLE" ]; then
            STORE_B64=$(jq -er .keystore <<< "$SIGNING_BUNDLE")
            STORE_PASS=$(jq -er .password <<< "$SIGNING_BUNDLE")
            KEY_ALIAS=$(jq -er .alias <<< "$SIGNING_BUNDLE")
            KEY_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$STORE_B64"
            export STORE_PASS KEY_PASS
            unset SIGNING_BUNDLE
          fi
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$out/key.jks"
          python3 - "$webroot" "$code" "$revision" "$out/payload.json" <<'PY'
          import base64,json,pathlib,sys
          root,code,rev,out=sys.argv[1:]
          names=['index.html','app.js','analytics.js','invoice-parser.js']
          files={n:base64.b64encode((pathlib.Path(root)/n).read_bytes()).decode('ascii') for n in names}
          pathlib.Path(out).write_text(json.dumps({'package':'ai.farukh.supply','nativeVersion':int(code),'revision':int(rev),'files':files},separators=(',',':')),encoding='utf-8')
          PY
          java supply-android/SignWeb.java "$out/key.jks" "$KEY_ALIAS" "$out/payload.json" "$out/web-current.json" "$cert" "$revision"
          test "$(wc -c < "$out/web-current.json")" -lt 1048576
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-premium-pro" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
          gh release upload "$tag" "$out/$apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --output "$out/verified.apk"
          test "$(sha256sum "$out/verified.apk" | cut -d' ' -f1)" = "$hash"
          gh release upload "$tag" "$out/web-current.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --output "$out/verified-web.json"
          cmp "$out/web-current.json" "$out/verified-web.json"
          gh release upload "$tag" "$out/update.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --output "$out/verified-manifest.json"
          cmp "$out/update.json" "$out/verified-manifest.json"
          echo "Published and verified native upgrade $code with embedded web revision $revision."
