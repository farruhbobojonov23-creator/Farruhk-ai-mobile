name: Supply offline Android OCR SDK lab
on:
  push:
    branches: ['feature/farukh-supply-ai']
    paths: ['ocr-mobile-lab/**', '.github/workflows/supply-ocr-mobile-lab.yml']
concurrency:
  group: supply-ocr-mobile-lab
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PaddlePaddle/PaddleOCR
          ref: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
          path: upstream-paddle
          persist-credentials: false
          sparse-checkout: deploy/ppocr-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test positioned OCR row reconstruction
        run: |
          javac -d /tmp/supply-row-test ocr-mobile-lab/src/*.java
          java -cp /tmp/supply-row-test InvoiceRowsTest
      - name: Prepare Cyrillic models for offline SDK
        run: bash ocr-mobile-lab/prepare.sh upstream-paddle/deploy/ppocr-android
      - name: Add synthetic Android runtime test
        run: |
          cp ocr-mobile-lab/SupplyInvoiceSmokeTest.kt upstream-paddle/deploy/ppocr-android/ppocr-sdk/src/androidTest/java/com/paddle/ocr/benchmark/
          cp ocr-mobile-lab/SupplyPaddleBridge.kt upstream-paddle/deploy/ppocr-android/ppocr-sdk/src/main/java/com/paddle/ocr/
          # Prefer official Maven repositories rather than slow third-party mirrors in CI.
          sed -i '/maven.aliyun.com/d' upstream-paddle/deploy/ppocr-android/settings.gradle.kts
      - name: Compile Android OCR library
        run: gradle -p upstream-paddle/deploy/ppocr-android :ppocr-sdk:assembleRelease :ppocr-sdk:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run synthetic Cyrillic invoice on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: gradle -p upstream-paddle/deploy/ppocr-android :ppocr-sdk:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.paddle.ocr.benchmark.SupplyInvoiceSmokeTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-paddle-sdk-lab
          path: |
            upstream-paddle/deploy/ppocr-android/ppocr-sdk/build/outputs/aar/*.aar
            upstream-paddle/deploy/ppocr-android/ppocr-sdk/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 7
