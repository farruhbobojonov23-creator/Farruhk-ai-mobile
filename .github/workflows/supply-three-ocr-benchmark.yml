name: Three OCR engines invoice benchmark (isolated)
on:
  push:
    branches: ['experiment/supply-local-vision-benchmark']
    paths: ['.github/workflows/supply-three-ocr-benchmark.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [structure, occular, vl]
    env:
      ENGINE: ${{ matrix.engine }}
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate identical fictional invoices and exact ground truth
        run: |
          mkdir -p inputs results
          pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import json
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',27)
          products=['Рис для суши','Сыр Hochland','Масло для фритюра','Соус Tamaki','Креветка очищенная']
          expected={}
          for page,n in [('short',5)]+[(f'long-{i}',20) for i in range(5)]:
              offset=0 if page=='short' else int(page[-1])*20
              im=Image.new('RGB',(1700,310+64*(n+2)),'white')
              d=ImageDraw.Draw(im); xs=[35,690,835,1060,1335,1665]; y=160; h=64
              d.text((35,25),'УПД № 8049 от 09.11.2026',font=font,fill='black')
              d.text((35,75),'Поставщик: ООО Учебный',font=font,fill='black')
              rows=[]
              for i in range(n):
                  k=offset+i
                  q=k%7+1; p=10000+k*113
                  cash=lambda v:f'{v//100},{v%100:02d}'
                  rows.append([products[k%5]+f' {k+1:03d} / 1 кг','уп',str(q)+',000',cash(p),cash(q*p)])
              total=sum((offset+i)%7+1 for i in []) # integer cents below
              total=sum(((offset+i)%7+1)*(10000+(offset+i)*113) for i in range(n))
              grid=[['Наименование товара','Ед.','Количество','Цена с НДС','Сумма с НДС']]+rows+[['Итого','','','',cash(total)]]
              for r,row in enumerate(grid):
                  for j,s in enumerate(row):d.text((xs[j]+8,y+r*h+15),s,font=font,fill='black')
              for x in xs:d.line((x,y,x,y+h*len(grid)),fill='black',width=2)
              for r in range(len(grid)+1):d.line((xs[0],y+r*h,xs[-1],y+r*h),fill='black',width=2)
              im.save(f'inputs/{page}.png')
              expected[page]={'rows':rows,'total':cash(total)}
              if page=='short':
                  im.rotate(90,expand=True,fillcolor='white').save('inputs/rotated.png')
                  im.rotate(5,expand=True,fillcolor='white').filter(ImageFilter.GaussianBlur(.65)).save('inputs/skewed.png')
                  expected['rotated']=expected['skewed']=expected[page]
          open('results/expected.json','w').write(json.dumps(expected,ensure_ascii=False,indent=2))
          PY
      - name: Install engine locally on CPU (no OCR API)
        run: |
          if [ "$ENGINE" = occular ]; then
            pip install occular-ocr
          else
            pip install 'paddlepaddle>=3.2.1,<4'
            if [ "$ENGINE" = vl ]; then pip install 'paddleocr[doc-parser]>=3.5,<4'; else pip install 'paddleocr[doc-parser]==3.3.1'; fi
          fi
          pip freeze > results/versions.txt
      - name: Run OCR on each image and capture time, output, and errors
        run: |
          cat > /tmp/compare.py <<'PY'
          import os,time,json,subprocess,traceback,resource
          from pathlib import Path
          engine=os.environ['ENGINE']; out=Path('results')
          report={'engine':engine,'scope':'synthetic images only, local CPU, not Android','pages':[]}
          def save():
              (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          start=time.monotonic()
          try:
              if engine=='structure':
                  from paddleocr import PPStructureV3
                  pipe=PPStructureV3(device='cpu',text_detection_model_name='PP-OCRv5_mobile_det',text_recognition_model_name='cyrillic_PP-OCRv5_mobile_rec',use_doc_orientation_classify=True,use_doc_unwarping=False,use_textline_orientation=True,use_formula_recognition=False,use_chart_recognition=False,use_seal_recognition=False,use_table_recognition=True)
              elif engine=='vl':
                  from paddleocr import PaddleOCRVL
                  pipe=PaddleOCRVL(device='cpu',use_doc_orientation_classify=True,use_doc_unwarping=False)
              report['init_s']=round(time.monotonic()-start,2);save()
              for path in sorted(Path('inputs').glob('*.png'),key=lambda p: (p.stem!='short',p.stem not in ('short','rotated','skewed'),p.stem)):
                  target=out/path.stem;target.mkdir(exist_ok=True)
                  t=time.monotonic(); row={'page':path.stem}
                  try:
                      if engine=='occular':
                          p=subprocess.run(['python','-m','occular',str(path),'--orientation','--tables','--out',str(target/'output.json')],capture_output=True,text=True,timeout=240)
                          (target/'stdout.txt').write_text(p.stdout)
                          (target/'stderr.txt').write_text(p.stderr)
                          if p.returncode:raise RuntimeError(f'CLI exit {p.returncode}')
                      else:
                          for r in pipe.predict(input=str(path)):
                              r.save_to_json(save_path=str(target))
                              r.save_to_markdown(save_path=str(target))
                      row['status']='ok'
                  except Exception as e:
                      row['status']='error';row['error']=str(e)
                  row['seconds']=round(time.monotonic()-t,2);row['peak_rss_kib']=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
                  report['pages'].append(row);save();print(json.dumps(row,ensure_ascii=False),flush=True)
          except Exception:
              report['initialization_error']=traceback.format_exc();save();raise
          if not report['pages'] or any(p['status']!='ok' for p in report['pages']):raise SystemExit(1)
          PY
          python /tmp/compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OCR-report-${{ matrix.engine }}
          path: results
          retention-days: 14
