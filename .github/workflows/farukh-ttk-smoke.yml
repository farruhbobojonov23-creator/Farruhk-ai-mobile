name: FARUKH TTK PRO Emulator Smoke
concurrency:
  group: ${{ github.workflow }}-farukh-ttk
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [farukh-ttk-pro]
    paths:
      - '.github/workflows/farukh-ttk-smoke.yml'
      - 'farukh-ttk-pro/app/**'
      - 'farukh-ttk-pro/updates/**'
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farukh-ttk-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Embed offline sushi photography
        run: |
          bash embed-food-photos.sh
          python -m pip install --quiet Pillow
          python clean-food-photos.py
          test "$(find app/src/main/assets/food -name '*.webp' | wc -l)" -eq 11
      - name: Build test APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Keep primary and isolated QA builds
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-primary-debug.apk
          gradle :app:assembleDebug -PqaPreview --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app-qa-debug.apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=android-smoke"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install & launch APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r farukh-ttk-pro/app-primary-debug.apk
            adb install -r farukh-ttk-pro/app-qa-debug.apk
            adb shell pm list packages | grep -q '^package:com.farukh.ttkpro.premium$'
            adb shell pm list packages | grep -q '^package:com.farukh.ttkpro.premium.qa$'
            adb shell am start -W -n com.farukh.ttkpro.premium.qa/com.farukh.ttkpro.MainActivity
            sleep 3
            adb shell am force-stop com.farukh.ttkpro.premium.qa
            adb shell am start -W -n com.farukh.ttkpro.premium/com.farukh.ttkpro.MainActivity
            sleep 10
            # Dismiss any emulator launcher ANR; return the TTK app to foreground.
            adb shell input tap 265 945 || true
            adb shell am start -W -n com.farukh.ttkpro.premium/com.farukh.ttkpro.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/farukh_home.png
            adb pull /sdcard/farukh_home.png farukh-home.png
            adb shell am force-stop com.farukh.ttkpro.premium
            adb shell am start -W -n com.farukh.ttkpro.premium/com.farukh.ttkpro.MainActivity --ez FARUKH_SCREEN_EDITOR true
            sleep 4
            adb shell screencap -p /sdcard/farukh_editor.png
            adb pull /sdcard/farukh_editor.png farukh-editor.png
            adb shell am force-stop com.farukh.ttkpro.premium
            adb shell am start -W -n com.farukh.ttkpro.premium/com.farukh.ttkpro.MainActivity --ez FARUKH_RUN_QA true
            sleep 12
            adb pull /sdcard/Android/data/com.farukh.ttkpro.premium/files/farukh-qa-results.txt farukh-qa-results.txt
            cat farukh-qa-results.txt
            grep -q 'RESULT: PASS' farukh-qa-results.txt
            adb pull /sdcard/Android/data/com.farukh.ttkpro.premium/files/farukh-smoke-0.pdf farukh-smoke-0.pdf
            adb pull /sdcard/Android/data/com.farukh.ttkpro.premium/files/farukh-smoke-1.pdf farukh-smoke-1.pdf
            adb pull /sdcard/Android/data/com.farukh.ttkpro.premium/files/farukh-smoke-2.pdf farukh-smoke-2.pdf
            adb pull /sdcard/Android/data/com.farukh.ttkpro.premium/files/farukh-smoke-3.pdf farukh-smoke-3.pdf
            adb logcat -d -s AndroidRuntime:E > runtime.log
            if grep -q "FATAL EXCEPTION" runtime.log; then cat runtime.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FARUKH-TTK-PRO-emulator-qa
          path: |
            farukh-home.png
            farukh-editor.png
            farukh-qa-results.txt
            farukh-smoke-*.pdf
            farukh-ttk-pro/runtime.log
          if-no-files-found: warn
