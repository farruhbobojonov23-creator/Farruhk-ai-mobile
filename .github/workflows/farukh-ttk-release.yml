name: FARUKH TTK PRO Stable Signed Release
on:
  workflow_dispatch:
  push:
    branches: [farukh-ttk-pro]
    paths:
      - 'farukh-ttk-pro/SIGNED_RELEASE_REQUEST.txt'
permissions:
  contents: write

concurrency:
  group: farukh-ttk-release
  cancel-in-progress: false

jobs:
  sign-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farukh-ttk-pro
    env:
      KEYSTORE_B64: ${{ secrets.FARUKH_TTK_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.FARUKH_TTK_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.FARUKH_TTK_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.FARUKH_TTK_KEY_PASSWORD }}
      EXPECTED_SHA256: ${{ secrets.FARUKH_TTK_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require private signing secrets
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing FARUKH_TTK_KEYSTORE_B64"; exit 2; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing FARUKH_TTK_STORE_PASSWORD"; exit 2; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing FARUKH_TTK_KEY_ALIAS"; exit 2; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing FARUKH_TTK_KEY_PASSWORD"; exit 2; }
          test -n "$EXPECTED_SHA256" || { echo "::error::Missing pinned FARUKH_TTK_CERT_SHA256 fingerprint"; exit 2; }
      - name: Require successful emulator verification on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name=="FARUKH TTK PRO Emulator Smoke" and .conclusion=="success")] | length')"
            if [ "$count" -gt 0 ]; then
              echo "Confirmed successful Android QA for exact release commit ${GITHUB_SHA}"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Android emulator smoke QA did not pass on this release commit within 10 minutes"
              exit 4
            fi
            sleep 10
          done
      - name: Prepare sushi photographs
        run: |
          bash embed-food-photos.sh
          python -m pip install --quiet Pillow
          python clean-food-photos.py
          test "$(find app/src/main/assets/food -name '*.webp' | wc -l)" -eq 11
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign release using GitHub secrets only
        shell: bash
        run: |
          set -euo pipefail
          export OUTDIR="$RUNNER_TEMP/farukh-signing"
          mkdir -p "$OUTDIR"
          chmod 700 "$OUTDIR"
          trap 'rm -rf "$OUTDIR"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$OUTDIR/key.jks"
          chmod 600 "$OUTDIR/key.jks"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APK_SIGNER"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/FARUKH-TTK-PRO-signed.apk"
          "$APK_SIGNER" sign --ks "$OUTDIR/key.jks" \
             --ks-key-alias "$KEY_ALIAS" \
             --ks-pass env:KEYSTORE_PASSWORD \
             --key-pass env:KEY_PASSWORD \
             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
             --out "$signed" "$unsigned"
          "$APK_SIGNER" verify --verbose --print-certs "$signed" | tee "$OUTDIR/signature.txt"
          ACTUAL_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$OUTDIR/signature.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED" ]; then
            echo "::error::APK certificate differs from pinned permanent production key"
            rm -f "$signed"
            exit 3
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FARUKH-TTK-PRO-signed-release
          path: farukh-ttk-pro/app/build/outputs/apk/release/FARUKH-TTK-PRO-signed.apk
          retention-days: 90
          if-no-files-found: error
      - name: Publish signed APK and atomic update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          NAME="$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$CODE"
          test -n "$NAME"
          TAG="farukh-ttk-pro-v${CODE}"
          SRC="app/build/outputs/apk/release/FARUKH-TTK-PRO-signed.apk"
          OUT="app/build/outputs/apk/release/FARUKH_TTK_PRO_v${CODE}_signed.apk"
          cp "$SRC" "$OUT"
          gh release create "$TAG" "$OUT" --target "$GITHUB_SHA" \
              --title "FARUKH TTK PRO v${NAME}" \
              --notes "Проверенный подписанный APK. Подпись защищена секретами; пользователи новой стабильной линии обновляются поверх предыдущей версии."
          export RELEASE_CODE="$CODE" RELEASE_NAME="$NAME" RELEASE_TAG="$TAG"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path("updates/latest.json")
          doc=json.loads(p.read_text(encoding="utf-8"))
          doc["packageId"]="com.farukh.ttkpro.premium"
          doc["versionCode"]=int(os.environ["RELEASE_CODE"])
          doc["versionName"]=os.environ["RELEASE_NAME"]
          doc["downloadUrl"]="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/releases/download/"+os.environ["RELEASE_TAG"]+"/FARUKH_TTK_PRO_v"+os.environ["RELEASE_CODE"]+"_signed.apk"
          doc["notes"]="Подписанный выпуск FARUKH TTK PRO: новые функции и исправления. Перед обновлением рекомендуем резервную копию."
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
          git config user.name "farukh-ttk-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Publish FARUKH TTK PRO signed v${CODE} update manifest [skip ci]"
          git push origin "HEAD:farukh-ttk-pro"
