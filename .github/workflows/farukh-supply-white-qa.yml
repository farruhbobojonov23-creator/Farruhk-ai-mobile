name: FARUKH SUPPLY White Premium functional QA
on:
  push:
    branches: ['feature/farukh-supply-simple-white', 'feature/farukh-supply-premium-pro', 'fix/supply-unseen-products-v71', 'fix/supply-web-ocr-v74', 'fix/supply-table-core-v75', 'fix/supply-restore-v47-flow-v76', 'experiment/supply-local-vision-benchmark', 'experiment/supply-smart-simple-v78']
    paths:
      - '.github/workflows/farukh-supply-white-qa.yml'
      - '.github/workflows/farukh-supply-white-test.yml'
      - 'supply-android/app/src/main/assets/**'
      - 'supply/**'
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned Playwright and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: supply-qa-ubuntu24-${{ runner.arch }}-playwright-1.56.1-v1
      - name: Install browser test tools
        run: |
          set -e
          mkdir -p /tmp/supply-qa
          npm install --prefix /tmp/supply-qa --prefer-offline --no-audit --no-fund playwright@1.56.1
          /tmp/supply-qa/node_modules/.bin/playwright install chromium
          # Avoid apt installation on runners that already have all browser libraries.
          # A real launch, not a cache hit, determines whether the fallback is needed.
          if ! node -e "const {chromium}=require('/tmp/supply-qa/node_modules/playwright'); (async()=>{const b=await chromium.launch({headless:true}); await b.close()})().catch(e=>{console.error(e);process.exit(1)})"; then
            /tmp/supply-qa/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Verify parser and catalog regression tests
        run: node --test supply/analytics.test.js supply/invoice-parser.test.js supply/product-catalog.test.js supply/table-core.test.js supply/structure-import.test.cjs
      - name: Run mobile UI and persistence QA
        run: |
          set -e
          mkdir -p qa-results /tmp/supply-legacy38
          git fetch --depth=1 origin bb8720076a445f1d524ddc1d327970e7fd72ffd2
          for f in index.html app.js analytics.js invoice-parser.js; do git show bb8720076a445f1d524ddc1d327970e7fd72ffd2:supply-android/app/src/main/assets/$f > /tmp/supply-legacy38/$f; done
          python3 -m http.server 8765 --bind 127.0.0.1 --directory supply-android/app/src/main/assets >/tmp/supply-http.log 2>&1 &
          cat > /tmp/supply-qa/check.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
          const browser=await chromium.launch({headless:true});
          try{
          const page=await browser.newPage({viewport:{width:393,height:873},isMobile:true,deviceScaleFactor:2,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('dialog',d=>d.accept());
          const started=Date.now();
          await page.goto('http://127.0.0.1:8765/index.html');
          await page.waitForFunction(()=>document.querySelector('#changes').textContent.includes('Изменения'));
          const startupMs=Date.now()-started;
          // OCR uncertainty must not turn the whole product card brown.
          const rowColors=await page.evaluate(()=>{
            const root=$('lines');
            const before=root.children.length;
            try {
              addLine({name:'Рис учебный 1 кг',quantity:3,price:100,unit:'уп',packKg:1});
              addLine({name:'Рис учебный 1 кг',quantity:3,price:100,unit:'уп',packKg:1,uncertain:true});
              addLine({name:'Учебный товар без фасовки',quantity:2,price:100,unit:'уп',uncertain:true});
              const normal=root.children[before],uncertain=root.children[before+1],missing=root.children[before+2];
              return {normal:getComputedStyle(normal).backgroundColor,uncertain:getComputedStyle(uncertain).backgroundColor,missing:getComputedStyle(missing).backgroundColor,warning:!!missing.querySelector('.pack-required'),inline:missing.querySelector('.pack-required')?.style.background||''};
            } finally {while(root.children.length>before)root.lastElementChild.remove();}
          });
          assert.deepEqual(rowColors,{normal:'rgb(23, 43, 70)',uncertain:'rgb(23, 43, 70)',missing:'rgb(23, 43, 70)',warning:true,inline:''});
          assert.deepEqual(await page.evaluate(()=>invoiceHeader('Счет-фактура № 8049 от 09 ноября 2026 г.')),{documentNumber:'8049',documentDate:'2026-11-09'});
          assert.deepEqual(await page.evaluate(()=>invoiceHeader('Счёт-фактура № 8049 от 09 ноября 2026 г.\nУПД № 8049 от 10 ноября 2026 г.')),{documentNumber:'8049',documentDate:null});
          await page.evaluate(()=>{
            const source='Счет-фактура № 123 от 09 ноября 2026 г.\nПоставщик: ООО «Веста»\nНаименование товара Стоимость товаров\n1 Сыр плавленый ломтевой 778 упак 3,000 828,18 2 484,55 без акциза 10% 248,45 2 733,00\nЧеддер уп/1,107 кг (90 шт) HOCHLAND\n2 Сухари панировочные 796 шт 4,000 233,64 934,55 без акциза 10% 93,45 1 028,00\nПанко Premium 1кг\nВсего к оплате (9) 3 419,10 341,90 3 761,00';
            const r=window.supplyInvoiceParser.parseSimple(source);
            if(!r.documentVerified||r.items.length!==2||r.items[0].quantity!==3||r.items[1].quantity!==4||r.items[0].invoiceTotal!==2733||r.items[1].invoiceTotal!==1028||!r.items[0].name.includes('HOCHLAND'))throw Error('UPD multiline reconciliation failed: '+JSON.stringify(r));
            if(window.supplyInvoiceParser.parseSimple(source.replace('3 761,00','3 761,10')).documentVerified)throw Error('UPD accepted inconsistent total');
          });
          await page.evaluate(()=>{
            const source='Уаверсальный Счет-фактура № 123 or 09 ноября 2026 г.(1)\nПоставщик: ООО «Веста»\nНаименование товара (описание выполненных\nСыр плавленый ломтевой 778 ynak 3,000 828.18 2484,55 5е3 10% 248.45 2733,00\n3кциза\nБистро Чеддер уп/1,107 кг(уп\n90 ШT) HOCHLAND\n2Сухари панировочные Панко 796 WT 4000 233.64 934.55 5e3 10% 93.45 1028,00\nакциза\nГолд NНАО PremИИm 1кг\nВсего к оплате (9) 3419.10 x 341.90 3761,00';
            const p=window.supplyInvoiceParser,r=p.parseSimple(source);
            if(!r.documentVerified||r.items.length!==2||r.items[0].quantity!==3||r.items[1].quantity!==4||r.items[0].invoiceTotal!==2733||r.items[1].invoiceTotal!==1028||!r.items[0].name.includes('HOCHLAND')||Math.abs(r.items[0].packKg-1.107)>0.00001)throw Error('Actual noisy UPD regression: '+JSON.stringify(r));
            if(invoiceHeader(source).documentDate!=='2026-11-09')throw Error('OCR Latin header date failed');
            if(p.parseSimple(source.replace('3761,00','3761,10')).documentVerified)throw Error('Unbalanced OCR accepted');
          });
          await page.evaluate(()=>{
            const pass1='Счет-фактура №: 123 o 09 ноноря 2026 г.\nИндивидуальный предприниматель Иванова\nАнна Сергеевна\nСыр плавленый ломтевой';
            const pass2='Уаверсальный Счет-фактура № 123 or 09 ноября 2026 г.(1)\nИндивидуальный предприниматель Иванова\nПродавец: Анна Сергеевна Покупатель: ИП Тестовый Покупатель (5)\nНаименование товара (описание выполненных\nСыр плавленый ломтевой 778 ynak 3,000 828.18 2484,55 5е3 10% 248.45 2733,00\n3кциза\nБистро Чеддер уп/1,107 кг(уп\n90 ШT) HOCHLAND\n2Сухари панировочные Панко 796 WT 4000 233.64 934.55 5e3 10% 93.45 1028,00\nакциза\nГолд NНАО PremИИm 1кг\nВсего к оплате (9) 3419.10 x 341.90 3761,00';
            const raw=pass1+'\n---\n'+pass2,p=window.supplyInvoiceParser;
            const verified=p.parseSamePhotoPasses([pass1,pass2]).find(r=>r.documentVerified&&r.items.length===2);
            if(!verified||invoiceHeader(raw).documentDate!=='2026-11-09')throw Error('Mixed IP OCR passes failed');
            const items=verified.items.map(grossRow);
            if(invoiceIntegrity(items,[],raw,'2026-11-09').error)throw Error('Valid UPD rejected');
            if(!invoiceIntegrity(items.slice(0,1),[],raw,'2026-11-09').error)throw Error('Missing UPD row accepted');
            if(!invoiceIntegrity(items,[],raw,'').error)throw Error('Missing UPD date accepted');
            if(!invoiceIntegrity(items.map((r,i)=>i?r:{...r,quantity:null}),[],raw,'2026-11-09').error)throw Error('Missing quantity accepted');
            if(!invoiceIntegrity(items,[],raw+'\n---\n'+pass2.replace('3419.10 x 341.90 3761,00','3419.10 x 342.90 3762,00'),'2026-11-09').error)throw Error('Conflicting totals accepted');
          });
          await page.evaluate(()=>{const p=window.supplyInvoiceParser,a=p.parseSimple("АКТ ПРИЕМА-ПЕРЕДАЧИ по УПД № 100/1 от 09.11.2026 г.\nПродавец: ООО «АЛИДИ ПРОФ»\nНаименование товара Количество Стоимость с НДС Отгружено Сроки годности\n1 4620749684390 АНАНАСЫ кольца 850 мл SUNFEEL [1] ШТ 12 0 5 22 278.66 1393.30 5 10.10.2028\n2 8887293103319 УГОРЬ филе 17-23 унц 5 кг [5] КГ 0 0 10 1444.50 7222.50 5 09.06.2028"),m=p.parseSimple("Официальное наименование: \"МАРР РУССИЯ\" ООО\n1 0903309716 Креветки 1 кг упак 2 2,000 1183,96 2367,92\n2 0903309716 Креветки 1 кг упак 18 18,000 1183,96 21311,28\nИтого : 20 20,000 23679,20");if(!a.pageVerified||a.items.length!==2||a.items[1].quantity!==5||a.items[1].invoiceTotal!==7222.5)throw Error('Act weight row');if(!m.documentVerified||m.items.length!==2||m.items[0].sourceRow===m.items[1].sourceRow)throw Error('MARR repeated article');});
          await page.evaluate(()=>{const p=window.supplyInvoiceParser,a="АКТ ПРИЕМА-ПЕРЕДАЧИ по УПД № 10026634964/851 от 09.11.2026 г.\nОБЩЕСТВО С ОГРАНИЧЕННОЙ ОТВЕТСТВЕННОСТЬЮ \"АЛИДИ ПРОФ\"\n1]4620749684390 АНИ 278.66 1393.30 5] 10.10.2028 |\n2235280167250 [2352802167250 413.00 413.00 1| 05.09.2027\n5 612.30 612.30 д| 03.10.2029\n231.92 2783.04 12| 19.03.2027\n326.93 980.79 3| 28.02.2027\n5.95 3998.40 oon ln 5.02.2027, 25.02.2027\n10.43 8761.20 840 19.04.2027 1\n8.45 8517.60 1008 12042027, 22.04.2027\n59354] 2374.16] 4| 18.03.2028\na Crispy Arare Том Ям Россия 1 кг. [1] | 1002.84 4011.36] 4| 25.05.2027\n1444.50 7222.50 5| 09.06.2028 |",b="8887293103319 УГОРь филе 17-23 унц (500-680 гр) без в/у с/м 5 кг.[5] 10 14660456380410 ШАРИКИ Рисовые CrisРУ Arare Том Ям Россия 1 кг. [1] СОУС Унаги 1,8 л. Татакі [1] СОУС соевый порционный Blаck 30 гр. [168] 4627065780393 ИМБИРь порционный маринованный белый 25 гр. [168] ВАСАБИ порционный 5 гр. [168] Петмол [1] СЛИВКИ питьевые ультрапастеризованные 22% 1 л. СыР плавленый сливочный 400 гр. Носhlаnd [1] кг. Ви Фрай ФМС9 [1] КАРТОФЕЛЬ фри с панировкой Fгу Ме Ехрегt 99 мм 2,5 кг.Черкизово [1] НАГГЕТСЫ классические из мяса птицы с/м 1,115 4620749684390 AHAHACЫ КОлЬца ж/6 850 мл. SUNFEEL [1] работ, оказанных услуг), имущественного права Наименование товара (описание выполненных\nОБЩЕСТВО С ОГРАНИЧЕННОЙ ОТВЕТСТВЕННОСТЬЮ \"АЛИДИ ПРОФ\"\nKГ ШТ ШТ ШТ ШТ ШТ ШТ ШТ ШТ ШТ A (условное обозначение) Единица измерения\n1444.50 1002.84 593.54 8.45 10.43 5.95 326.93 231.92 612.30 413.00 278.66 6 рub.кoп. за ЕИ, с НДС МОСТЬ Стои- 502\n7222.50 4011.36 2374.16 8517.60 8761.20 3998.40 980.79 2783.04 612.30 413.00 1393.30 0 рub.коп. с НДС, СТОИМОСТЬ Общая",r=p.parseSamePhotoPasses([a,b]).find(x=>x.columnRecovered);if(!r||r.items.length!==11||r.items.reduce((s,x)=>s+Math.round(x.invoiceTotal*100),0)!==4106765||r.documentVerified||r.pageVerified)throw Error('Actual ALIDI column recovery failed');if(p.parseSamePhotoPasses([b]).some(x=>x.columnRecovered))throw Error('Recovered without independent evidence');});
          assert.equal(await page.locator('#productCount').textContent(),'0');
          assert.equal(await page.locator('#supplierCount').textContent(),'0');
          assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
          assert.equal(await page.locator('header').evaluate(e=>getComputedStyle(e).position),'sticky');
          assert.equal(await page.locator('nav').evaluate(e=>getComputedStyle(e).position),'fixed');
          assert.ok(await page.locator('a.update').getAttribute('href')==='https://appassets.androidplatform.net/update');
          for(const width of [320,360,393,430,740]){
            await page.setViewportSize({width,height:873});
            assert.ok(await page.evaluate(()=>{const a=document.querySelector('.hero-copy').getBoundingClientRect(),b=document.querySelector('.hero-art').getBoundingClientRect(),h=document.querySelector('.hero h1').getBoundingClientRect();return a.right<=b.left+1&&h.right<=b.left+1&&document.documentElement.scrollWidth<=innerWidth}), 'Hero content must not overlap at '+width);
            assert.ok(await page.evaluate(()=>[...document.querySelectorAll('nav button')].every(b=>b.scrollWidth<=b.clientWidth&&getComputedStyle(b).whiteSpace==='nowrap')), 'Navigation labels must fit at '+width);
          }
          await page.setViewportSize({width:393,height:873});
          assert.equal(await page.locator('[data-home-panel]:visible').count(),1);
          assert.equal(await page.locator('.vision-kpis .kpi').count(),4);
          assert.ok(await page.evaluate(()=>document.querySelector('.subnav').getBoundingClientRect().bottom<innerHeight-60));
          await page.screenshot({path:'qa-results/01-home.png',fullPage:true});
          await page.evaluate(()=>{
            const full={supplier:'Тест',documentVerified:true,items:[{name:'Рис',price:100,quantity:2,unit:'уп'}]};
            const weak={supplier:'Тест',items:[{name:'Рис',price:100,quantity:null,unit:'уп'}]};
            const wrong={...full,items:[{...full.items[0],price:110}]};
            if(scanNextPass(0,weak,false,[weak])!=='paddle-scan')throw Error('Paddle must precede focused retry');
            if(scanNextPass(1,full,false,[weak,full])!==null)throw Error('Verified amount must not require another OCR for pack alone');
            if(scanNextPass(1,weak,false,[weak])!=='rescan')throw Error('Incomplete results need focused fallback');
            if(scanNextPass(1,wrong,true,[full,wrong])!=='rescan')throw Error('Conflicting verified totals must not skip retry');
            if(scanNextPass(2,weak,false,[weak])!==null)throw Error('Retry bound');
            if(scanNextPass(0,full,true,[full])!==null)throw Error('Verified initial result must not retry');
            const plausible={...full,documentVerified:false};
            if(scanNextPass(0,plausible,true,[plausible])!==null)throw Error('v47 complete non-conflicting scan should be shown for review');
            if(scanNextPass(1,plausible,true,[plausible])!==null)throw Error('v47 complete Paddle scan should be shown for review');
            const marr={...plausible,supplier:'ООО «МАРР РУССИЯ»'};
            if(scanNextPass(0,marr,true,[marr])!=='paddle-scan'||scanNextPass(1,marr,true,[marr])!=='rescan')throw Error('MARR review retries must remain');
            if(scanNextPass(2,plausible,true,[plausible])!==null)throw Error('Bounded retries');
          });

          // Opt-in auto OCR: no network by default, mock private endpoint, fallback unchanged.
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate(()=>{
            if($('structureAuto').checked||localStorage.getItem('supplyStructureEndpoint'))throw Error('OCR must be opt-in');
            $('structureAuto').checked=true;$('structureEndpoint').value='http://invalid.example/v1/ocr';$('structureToken').value='a'.repeat(32);$('structureAutoSave').click();
            if(localStorage.getItem('supplyStructureEndpoint'))throw Error('Insecure endpoint accepted');
            $('structureEndpoint').value='https://ocr-test.example/v1/ocr';$('structureAutoSave').click();
            if(!localStorage.getItem('supplyStructureEndpoint'))throw Error('Valid opt-in failed');
          });
          await page.evaluate(async()=>{
            const original=window.fetch;
            try {
              const file=new File(['fake-image'],'test.jpg',{type:'image/jpeg'});
              pendingPhoto=file;
              window.fetch=async(url,opts)=>{
                if(url!=='https://ocr-test.example/v1/ocr'||opts.headers.Authorization!=='Bearer '+'a'.repeat(32)||opts.body.get('image').size!==file.size)throw Error('Incorrect private request');
                return {ok:true,text:async()=>JSON.stringify([{file:'invoice.png',page:1,text:['Накладная № 8049 от 09.11.2026','Поставщик: ООО Учебный'],tables:[[['Наименование товара','Ед.','Количество','Цена с НДС','Сумма с НДС'],['Рис','кг','2','100','200'],['Итого','','','','200']]]}])};
              };
              const count=docs.length;window.supplyOcrStart(981);await window.supplyOcrFinish(981,'','', '[]');
              if($('lines').children.length!==1||!$('ocrState').textContent.includes('PP-StructureV3: 1 строк')||docs.length!==count)throw Error('Automatic draft failed: '+$('ocrState').textContent+' '+$('structureWarnings').textContent);
              reset();
              pendingPhoto=new File(['fake-image2'],'test2.jpg',{type:'image/jpeg'});
              window.fetch=async()=>{throw Error('offline')};window.supplyOcrStart(982);await window.supplyOcrFinish(982,'Поставщик: ООО Учебный\nТовар Цена\n1 Рис 110,00','', '[]');
              if(!$('structureWarnings').textContent.includes('резервный OCR'))throw Error('Missing fallback warning');
              $('structureAuto').checked=false;$('structureAutoSave').click();if(localStorage.getItem('supplyStructureEndpoint'))throw Error('Opt-out failed');
            } finally {window.fetch=original;reset();}
          });
          await page.locator('nav button[data-go=home]').click();

          // Local fallback automatically fills a new draft without manual confirmation.
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate(async()=>{
            const previous=window.supplySmartScan.scanPhoto;let calls=0;
            try{
              const file=new File(['fake-image'],'local.jpg',{type:'image/jpeg'});
              pendingPhoto=file;ocrId=983;photoPassTexts=['Поставщик: ООО Учебный'];
              window.supplySmartScan.scanPhoto=async()=>{calls++;return {items:[],result:{rows:[{name:'Рис новый',quantity:2,price:150,total:300,arithmeticOK:true}],sum:300,printedTotal:300,totalOK:true}};};
              await window.supplyTryLocalAuto(983,file);
              if(calls!==1||$('lines').children.length!==1||!$('ocrState').textContent.includes('автоматически')||lineData($('lines').firstElementChild).price!==150)throw Error('Automatic local fallback failed: '+$('ocrState').textContent);
              await window.supplyTryLocalAuto(983,file);
              if(calls!==1)throw Error('Repeated automatic scan');
              reset();pendingPhoto=new File(['fake'],'local2.jpg',{type:'image/jpeg'});ocrId=984;
              addLine({name:'Existing',price:100,quantity:1,unit:'кг'});
              await window.supplyTryLocalAuto(984,pendingPhoto);
              if(calls!==1)throw Error('Auto scan overwrote valid draft');
            }finally{window.supplySmartScan.scanPhoto=previous;reset();}
          });
          await page.locator('nav button[data-go=home]').click();

          // PP-StructureV3 beta import: 100 rows; no auto-save or corruption of existing data.
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate(()=>{
            const before=docs.length;
            const rows=Array.from({length:100},(_,i)=>['Рис Tamaki '+i,'кг','2','150,50','301,00']);
            $('structureJson').value=JSON.stringify([{file:'test.jpg',page:1,text:['Накладная № 8049 от 09.11.2026','Поставщик: ООО Учебный'],tables:[[['Наименование товара','Ед.','Количество','Цена с НДС','Сумма с НДС'],...rows,['Итого','','','','30100,00']]]}]);
            $('structureImportButton').click();
            if($('lines').children.length!==100||!$('ocrState').textContent.includes('100 строк')||docs.length!==before)throw Error('PP-StructureV3 import UI failed: '+$('structureWarnings').textContent);
            if($('documentNumber').value!=='8049'||$('documentDate').value!=='2026-11-09')throw Error('Import document header failed');
            $('structureJson').value='[]';$('structureImportButton').click();
            if($('lines').children.length!==100)throw Error('Import replaced unsaved draft');
            reset();
          });
          await page.locator('nav button[data-go=home]').click();

          // Simulated native callbacks: never let an earlier empty OCR hide a later nonempty diagnostic.
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate(()=>{
            let calls=0;const original=window.supplySpatial.candidate;
            window.supplySpatial.candidate=()=>{calls++;throw Error('disabled path used')};
            try{
              const empty=window.supplyInvoiceParser.parseSimple('');
              scanCandidates=[{r:empty,text:'',error:'Текст не найден.'}];scanPass=2;
              window.supplyOcrStart(900);
              window.supplyOcrFinish(900,'Неразборчивый фрагмент документа','',JSON.stringify([{text:'фрагмент',left:0,top:0,right:10,bottom:10,confidence:.95}]));
              if(calls!==0)throw Error('Spatial recovery should not be called in restored pipeline');
              if(!$('ocrState').textContent.includes('Текст прочитан, но товары и цены не извлечены'))throw Error('Wrong OCR failure diagnosis: '+$('ocrState').textContent);
              if(!document.querySelector('#ocrDiagnostic textarea').value.includes('Неразборчивый'))throw Error('Lost OCR diagnostic');
            }finally{window.supplySpatial.candidate=original;reset();}
          });
          await page.locator('nav button[data-go=home]').click();

