name: FARUKH SUPPLY White Premium functional QA
on:
  push:
    branches: ['feature/farukh-supply-simple-white']
    paths:
      - '.github/workflows/farukh-supply-white-qa.yml'
      - 'supply-android/app/src/main/assets/**'
      - 'supply/**'
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned Playwright and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: supply-qa-ubuntu24-${{ runner.arch }}-playwright-1.56.1-v1
      - name: Install browser test tools
        run: |
          set -e
          mkdir -p /tmp/supply-qa
          npm install --prefix /tmp/supply-qa --prefer-offline --no-audit --no-fund playwright@1.56.1
          /tmp/supply-qa/node_modules/.bin/playwright install chromium
          # Avoid apt installation on runners that already have all browser libraries.
          # A real launch, not a cache hit, determines whether the fallback is needed.
          if ! node -e "const {chromium}=require('/tmp/supply-qa/node_modules/playwright'); (async()=>{const b=await chromium.launch({headless:true}); await b.close()})().catch(e=>{console.error(e);process.exit(1)})"; then
            /tmp/supply-qa/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Run mobile UI and persistence QA
        run: |
          set -e
          mkdir -p qa-results
          python3 -m http.server 8765 --bind 127.0.0.1 --directory supply-android/app/src/main/assets >/tmp/supply-http.log 2>&1 &
          cat > /tmp/supply-qa/check.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
          const browser=await chromium.launch({headless:true});
          try{
          const page=await browser.newPage({viewport:{width:393,height:873},isMobile:true,deviceScaleFactor:2,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('dialog',d=>d.accept());
          const started=Date.now();
          await page.goto('http://127.0.0.1:8765/index.html');
          await page.waitForFunction(()=>document.querySelector('#changes').textContent.includes('Изменения'));
          const startupMs=Date.now()-started;
          assert.equal(await page.locator('#productCount').textContent(),'0');
          assert.equal(await page.locator('#supplierCount').textContent(),'0');
          assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
          assert.equal(await page.locator('header').evaluate(e=>getComputedStyle(e).position),'sticky');
          assert.equal(await page.locator('nav').evaluate(e=>getComputedStyle(e).position),'fixed');
          assert.ok(await page.locator('a.update').getAttribute('href')==='https://appassets.androidplatform.net/update');
          await page.screenshot({path:'qa-results/01-home.png',fullPage:true});
          async function invoice(supplier,price,id,withPhoto){
            await page.locator('button[data-go=entry]:visible').first().click();
            if(withPhoto){
              await page.locator('#file').setInputFiles({name:'sample.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jB1sAAAAASUVORK5CYII=','base64')});
              await page.locator('#preview').waitFor({state:'visible'});
            }
            await page.evaluate(({supplier,price,id})=>{
              window.supplyOcrStart(id);
              window.supplyOcrFinish(id,'Поставщик: '+supplier+'\nТовар Цена\n1 Рис Tamaki '+price+',00\n2 Нори Gold 850,00','');
            },{supplier,price,id});
            assert.equal(await page.locator('#supplier').inputValue(),supplier);
            assert.equal(await page.locator('[data-field=name]').first().inputValue(),'Рис Tamaki');
            assert.equal(Number((await page.locator('[data-field=price]').first().inputValue()).replace(',','.')),price);
            assert.equal(await page.locator('#lines .line').count(),2);
            await page.screenshot({path:'qa-results/02-invoice.png',fullPage:true});
            await page.locator('#save').click();
            await page.locator('#archive').waitFor({state:'visible'});
            await page.waitForFunction(()=>document.querySelector('#status').textContent.includes('сохранена'));
          }
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate(()=>{window.supplyOcrStart(90);window.supplyOcrFinish(90,'Поставщик: Восток-Запад\nНаименование товара Количество Цена Сумма\n1 Сыр творожный (фасовка 10кг) шт 3 4 500,00 13 500,00','');});
          assert.equal(await page.locator('[data-field=packKg]').inputValue(),'10');
          assert.equal(await page.locator('[data-field=quantity]').inputValue(),'3');
          assert.equal(await page.locator('[data-field=unit]').inputValue(),'шт');
          assert.ok((await page.locator('.line-summary').innerText()).includes('30 кг'));
          await page.locator('[data-field=quantity]').fill('4');
          assert.ok((await page.locator('.line-summary').innerText()).includes('40 кг'));
          assert.ok((await page.locator('.kg-price').innerText()).includes('450,00'));
          assert.ok((await page.locator('.line-total').innerText()).replace(/\s/g,'').includes('13500,00'), 'Original invoice total must remain unchanged when derived metrics update');
          await page.evaluate(()=>{
            const history=[{simpleVersion:1,supplierId:'Поставщик тест',lines:[{name:'Майонез тест / шт (с НДС)',article:'123456789',unit:'шт',packKg:9.4}]}];
            const product={name:'Майонез тест / шт (с НДС)',article:'123456789',unit:'шт'};
            if(knownPack(product,'Поставщик тест',history)!==9.4)throw Error('Saved pack not found');
            if(knownPack(product,'Другой поставщик',history)!==null)throw Error('Supplier isolation failed');
            if(knownPack({...product,article:'999999999'},'Поставщик тест',history)!==null)throw Error('Article isolation failed');
            const conflict=[...history,{...history[0],lines:[{...history[0].lines[0],packKg:10}]}];
            if(knownPack(product,'Поставщик тест',conflict)!==null)throw Error('Conflicting weights must not be guessed');
            const m=window.supplyInvoiceParser.lineMetrics({...product,packKg:9.4,quantity:4,price:1906.86});
            if(m.totalKg!==37.6||m.pricePerKg!==202.86||m.totalPrice!==7627.44)throw Error('Incorrect calculation');
            const original=docs;
            try{docs=history;$('supplier').value='Поставщик тест';addLine({...product,quantity:4,price:1906.86});
             const last=$('lines').lastElementChild;
             if(last.querySelector('[data-field=packKg]').value!=='9.4'||!last.querySelector('.kg-price').textContent.includes('202,86'))throw Error('Automatic field completion failed');
             last.remove();
            }finally{docs=original;$('supplier').value='Восток-Запад';}
          });
          await page.evaluate(()=>{
            const row={name:'Майонез учебный / шт (с НДС)',unit:'шт',quantity:4,price:1906.86,invoiceTotal:7627.45};
            addLine(row);const el=$('lines').lastElementChild;
            const total=el.querySelector('.line-total output').textContent;
            const pack=el.querySelector('[data-field=packKg]');pack.value='9.4';pack.dispatchEvent(new Event('input',{bubbles:true}));
            if(el.querySelector('.line-total output').textContent!==total||!total.replace(/\s/g,'').includes('7627,45'))throw Error('Original total changed');
            const data=lineData(el),m=window.supplyInvoiceParser.lineMetrics(data);
            if(data.quantity!==4||data.price!==1906.86||data.invoiceTotal!==7627.45||m.totalKg!==37.6||m.pricePerKg!==202.86)throw Error('Invoice values or derived values changed incorrectly');
            el.remove();
          });
          await page.evaluate(()=>{
            addLine({name:'Сироп учебный 1л / шт (без НДС)',unit:'шт',quantity:2,price:590.98,invoiceTotal:1442});
            const el=$('lines').lastElementChild,data=lineData(el);
            if(data.packL!==1||data.packKg!==null||el.querySelector('[data-field=packMeasure]').value!=='л')throw Error('Volume not populated');
            if(!el.querySelector('.line-summary').textContent.includes('2 л')||!el.querySelector('.kg-price').textContent.includes('590,98'))throw Error('Volume metrics not shown');
            if(!el.querySelector('.line-total').textContent.replace(/\s/g,'').includes('1442,00'))throw Error('Invoice total changed');
            if(!el.querySelector('[data-field=price]').getAttribute('aria-label').includes('без НДС'))throw Error('VAT basis missing');
            el.remove();
            addLine({name:'Сироп учебный',unit:'шт',quantity:2,price:590.98,packL:1,invoiceTotal:1442});
            const saved=$('lines').lastElementChild;
            if(lineData(saved).packL!==1||lineData(saved).packKg!==null)throw Error('Saved volume was lost');
            saved.remove();
          });
          await page.setViewportSize({width:320,height:740});
          for(let i=0;i<29;i++)await page.locator('#addLine').click();
          assert.equal(await page.locator('#lines .line').count(),30);
          assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
          await page.setViewportSize({width:393,height:873});
          await page.locator('nav button[data-go=home]').click();
          await page.locator('button[data-go=entry]:visible').first().click();
          await page.evaluate((s)=>{window.supplyOcrStart(91);window.supplyOcrFinish(91,s,'');},"Поставщик: Восток-Запад\nФорель тестовая филе с кожей\nмороженая, Trim C 1,8кг+ 123456789 КГ\n10.00 85,680.00 47.60 51.20\nсоленая пищевая рыбная продукция\nВ том числе НДС 7,789.09");
          assert.equal(await page.locator('[data-field=quantity]').inputValue(),'47.6');
          assert.equal(await page.locator('[data-field=price]').inputValue(),'1800');
          assert.equal(await page.locator('[data-field=unit]').inputValue(),'кг');
          await page.locator('nav button[data-go=home]').click();
          // Same invoice, sequential native-style photo callbacks, persistence and duplicate rejection.
          await page.locator('button[data-go=entry]:visible').first().click();
          async function scanPage(n,supplier,product,id){
            await page.locator('#file').setInputFiles({name:'page-'+n+'-'+id+'.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jB1sAAAAASUVORK5CYII=','base64')});
            await page.evaluate(({n,supplier,product,id})=>{
              window.supplyOcrStart(id);
              window.supplyOcrFinish(id,'Накладная № 123\nПоставщик: '+supplier+'\nТовар Цена\n1 '+product+' 100,00\nстр. '+n+' из 3','');
            },{n,supplier,product,id});
          }
          await scanPage(1,'Поставщик тест','Рис тест',201);
          await scanPage(2,'Поставщик тест','Нори тест',202);
          assert.equal(await page.locator('#lines .line').count(),2);
          await scanPage(2,'Поставщик тест','Нори тест',203);
          assert.equal(await page.locator('#lines .line').count(),2);
          assert.ok((await page.locator('#ocrState').innerText()).includes('уже добавлена'));
          await scanPage(3,'Другой поставщик','Сыр тест',204);
          assert.equal(await page.locator('#lines .line').count(),2);
          assert.ok((await page.locator('#ocrState').innerText()).includes('Другой поставщик'));
          await scanPage(3,'Поставщик тест','Сыр тест',205);
          assert.equal(await page.locator('#lines .line').count(),3);
          assert.ok((await page.locator('#pageState').innerText()).includes('3 из 3'));
          await page.locator('#save').click();
          await page.locator('#archive').waitFor({state:'visible'});
          await page.reload();
          await page.waitForFunction(()=>docs.length===1);
          await page.locator('nav button[data-go=invoices]').click();
          assert.ok((await page.locator('#archive').innerText()).includes('Фото (3)'));
          await page.locator('#archive button').filter({hasText:'Редактировать'}).click();
          assert.equal(await page.locator('#lines .line').count(),3);
          assert.ok((await page.locator('#pageState').innerText()).includes('3 из 3'));
          await page.locator('nav button[data-go=invoices]').click();
          await page.locator('#archive button').filter({hasText:'Удалить'}).click();
          await page.waitForFunction(()=>docs.length===0);
          await invoice('Поставщик А',135,1,true);
          await invoice('Поставщик Б',150,2,false);
          await invoice('Поставщик А',125,3,false);
          await page.locator('nav button[data-go=compare]').click();
          assert.ok((await page.locator('#offers').innerText()).includes('Лучшая цена'));
          assert.ok((await page.locator('#offers').innerText()).includes('125'));
          await page.screenshot({path:'qa-results/03-compare.png',fullPage:true});
          await page.locator('nav button[data-go=home]').click();
          assert.equal(await page.locator('#productCount').textContent(),'2');
          assert.equal(await page.locator('#supplierCount').textContent(),'2');
          assert.ok((await page.locator('#changes').innerText()).includes('10'));
          await page.reload();
          await page.waitForFunction(()=>document.querySelector('#productCount').textContent==='2');
          assert.equal(await page.locator('#supplierCount').textContent(),'2');
          await page.locator('nav button[data-go=products]').click();
          await page.locator('#search').fill('Нори');
          assert.ok((await page.locator('#productList').innerText()).includes('Нори Gold'));
          assert.ok(!(await page.locator('#productList').innerText()).includes('Рис Tamaki'));
          await page.locator('nav button[data-go=suppliers]').click();
          assert.ok((await page.locator('#supplierList').innerText()).includes('Поставщик Б'));
          const supplierA=page.locator('#supplierList .card').filter({has:page.locator('h2',{hasText:'Поставщик А'})});
          assert.equal(await supplierA.count(),1);
          assert.ok((await supplierA.innerText()).includes('2 накладных'));
          const history=supplierA.locator('details').filter({hasText:'Рис Tamaki'});
          assert.equal(await history.count(),1);
          await history.locator('summary').click();
          assert.ok((await history.innerText()).includes('Снижение'));
          assert.ok((await history.innerText()).includes('135,00'));
          assert.ok((await history.innerText()).includes('125,00'));
          const noriHistory=supplierA.locator('details').filter({hasText:'Нори Gold'});
          await noriHistory.locator('summary').click();
          assert.ok((await noriHistory.innerText()).includes('Цена без изменений'));
          await supplierA.getByRole('button',{name:'Накладные поставщика'}).click();
          await page.waitForFunction(()=>document.querySelectorAll('#archive .card').length===2);
          assert.ok(!(await page.locator('#archive').innerText()).includes('Поставщик Б'));
          await page.locator('#archive').getByRole('button',{name:'Все накладные'}).click();
          await page.waitForFunction(()=>document.querySelectorAll('#archive .card').length===3);
          assert.equal(await page.evaluate(()=>supplierKey('ООО «АЛИДИ ПРОФ»')===supplierKey('Общество с ограниченной ответственностью "АЛИДИ ПРОФ"')),true);
          assert.equal(await page.evaluate(()=>supplierKey('ООО АЛИДИ ПРОФ')===supplierKey('ИП АЛИДИ ПРОФ')),false);
          await page.locator('nav button[data-go=invoices]').click();
          assert.equal(await page.locator('#archive .card').count(),3);
          await page.locator('#archive button').filter({hasText:'Редактировать'}).first().click();
          await page.locator('[data-field=price]').first().fill('120');
          await page.locator('#save').click();
          await page.locator('#archive').waitFor({state:'visible'});
          await page.locator('#archive button').filter({hasText:'Удалить'}).first().click();
          await page.waitForFunction(()=>document.querySelectorAll('#archive .card').length===2);
          assert.deepEqual(errors,[]);
          fs.writeFileSync('qa-results/report.json',JSON.stringify({passed:true,startupMs,scope:'Chromium mobile layout, simulated native OCR callback, upload preview, save/reload, comparison, price changes, search, supplier view, edit/delete, updater link only',limitations:'Not physical Android, no real invoice OCR, no signed update install'},null,2));
          console.log('PASS mobile functional QA; startup '+startupMs+' ms');
          }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/supply-qa/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FARUKH-SUPPLY-functional-QA
          path: qa-results

  publish-web:
    needs: mobile-ui
    if: github.ref == 'refs/heads/feature/farukh-supply-simple-white'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: farukh-supply-web-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify all regression tests
        run: |
          node --test supply/analytics.test.js supply/invoice-parser.test.js
          node --check supply-android/app/src/main/assets/app.js
          node --check supply-android/app/src/main/assets/invoice-parser.js
      - name: Sign and publish small web update, preserve installed Android version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_BUNDLE: ${{ secrets.FARUKH_SUPPLY_SIGNING_BUNDLE }}
          STORE_B64: ${{ secrets.FARUKH_SUPPLY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FARUKH_SUPPLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Do not publish superseded commits.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-simple-white" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then echo "Superseded commit; skipping publication."; exit 0; fi
          if [ -n "$SIGNING_BUNDLE" ]; then
            STORE_B64=$(jq -er .keystore <<< "$SIGNING_BUNDLE")
            STORE_PASS=$(jq -er .password <<< "$SIGNING_BUNDLE")
            KEY_ALIAS=$(jq -er .alias <<< "$SIGNING_BUNDLE")
            KEY_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$STORE_B64"
            export STORE_PASS KEY_PASS
            unset SIGNING_BUNDLE
          fi
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$out/key.jks"
          tag=farukh-supply-current
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$out"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --dir "$out"
          code=$(awk '/versionCode / {print $2;exit}' supply-android/app/build.gradle)
          test "$(jq -er .package "$out/update.json")" = ai.farukh.supply
          test "$(jq -er .versionCode "$out/update.json")" = "$code"
          cert=$(jq -er .cert "$out/update.json")
          webroot=supply-android/app/src/main/assets
          revision=$(tr -d '[:space:]' < "$webroot/web-version.txt")
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          jq -er .payload "$out/web-current.json" | base64 -d > "$out/previous-payload.json"
          test "$(jq -er .nativeVersion "$out/previous-payload.json")" = "$code"
          previous=$(jq -er .revision "$out/previous-payload.json")
          if [ "$previous" -ge "$revision" ]; then echo "Already published or revision not increased"; exit 0; fi
          python3 - "$webroot" "$code" "$revision" "$out/payload.json" <<'PY'
          import base64,json,pathlib,sys
          root,code,rev,out=sys.argv[1:]
          names=['index.html','app.js','analytics.js','invoice-parser.js']
          files={n:base64.b64encode((pathlib.Path(root)/n).read_bytes()).decode('ascii') for n in names}
          pathlib.Path(out).write_text(json.dumps({'package':'ai.farukh.supply','nativeVersion':int(code),'revision':int(rev),'files':files},separators=(',',':')),encoding='utf-8')
          PY
          mkdir "$out/new"
          java supply-android/SignWeb.java "$out/key.jks" "$KEY_ALIAS" "$out/payload.json" "$out/new/web-current.json" "$cert" "$revision"
          test "$(wc -c < "$out/new/web-current.json")" -lt 1048576
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/farukh-supply-simple-white" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA"
          gh release upload "$tag" "$out/new/web-current.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-current.json --output "$out/verified.json"
          cmp "$out/new/web-current.json" "$out/verified.json"
          echo "Published and verified web revision $revision, Android version $code unchanged."
