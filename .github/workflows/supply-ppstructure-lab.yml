name: Free full PP-StructureV3 photo benchmark (isolated)
on:
  push:
    branches: ['experiment/supply-ppstructure-v3']
permissions:
  contents: read
jobs:
  photo-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open local models runtime
        run: |
          python -m pip install 'paddlepaddle>=3.2,<4' 'paddleocr[doc-parser]>=3.3,<4' pillow
          python -m pip show paddleocr paddlepaddle
      - name: Create fictional invoice photo with camera shadows and perspective
        run: |
          mkdir -p "$RUNNER_TEMP/pp-lab"
          python - <<'PY'
          import os, json
          from pathlib import Path
          import cv2, numpy as np
          from PIL import Image,ImageDraw,ImageFont
          root=Path(os.environ['RUNNER_TEMP'])/'pp-lab'
          im=Image.new('RGB',(1800,1270),'white')
          d=ImageDraw.Draw(im)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',25)
          title=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',35)
          d.text((70,40),'Накладная № ТЕСТ-105 от 20.11.2026',font=title,fill='black')
          d.text((70,100),'Поставщик: ООО Учебный склад',font=font,fill='black')
          d.text((70,150),'Документ для испытания. Не является реальной накладной.',font=font,fill='black')
          products=['Мука пшеничная 5 кг','Сыр сливочный 400 г','Рис круглозёрный 25 кг','Соус томатный 1 л','Масло растительное 5 л','Крахмал кукурузный 1 кг','Сахар белый 10 кг','Какао порошок 500 г','Соль пищевая 1 кг','Огурцы маринованные 3 кг','Фасоль красная 800 г']
          quantities=[3,12,2,8,4,5,1,6,10,3,7]
          prices=[12450,25190,263400,19732,82165,14670,93623,63918,5678,32214,17895]
          fmt=lambda v:f'{v//100},{v%100:02}'
          rows=[['№','Наименование товара','Ед.','Количество','Цена с НДС','Сумма']]
          rows += [[str(i+1),p,'шт',str(q),fmt(v),fmt(q*v)] for i,(p,q,v) in enumerate(zip(products,quantities,prices))]
          rows += [['','Итого','','','',fmt(sum(q*v for q,v in zip(quantities,prices)))]]
          xs=[60,135,870,990,1200,1460,1740]
          ys=[220+i*70 for i in range(len(rows)+1)]
          for x in xs:d.line((x,ys[0],x,ys[-1]),fill='black',width=2)
          for y in ys:d.line((xs[0],y,xs[-1],y),fill='black',width=2)
          for i,row in enumerate(rows):
              for j,v in enumerate(row):d.text((xs[j]+9,ys[i]+20),v,font=font,fill='black')
          im.save(root/'clean.png')
          rgb=np.array(im)
          x,y=np.meshgrid(np.linspace(0,1,1800),np.linspace(0,1,1270))
          shade=1-.47*np.exp(-((x-.59)**2/.020+(y-.69)**2/.055))
          rgb=np.clip(rgb*shade[...,None],0,255).astype('uint8')
          M=cv2.getPerspectiveTransform(np.float32([[0,0],[1799,0],[1799,1269],[0,1269]]),np.float32([[34,18],[1730,47],[1795,1253],[10,1229]]))
          rgb=cv2.warpPerspective(rgb,M,(1800,1270),borderValue=(210,210,210))
          rgb=cv2.GaussianBlur(rgb,(3,3),.65)
          cv2.imwrite(str(root/'photo.jpg'),cv2.cvtColor(rgb,cv2.COLOR_RGB2BGR),[cv2.IMWRITE_JPEG_QUALITY,75])
          (root/'expected.json').write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Run actual table and text recognition
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          python supply/experimental/ppstructure_lab.py "$RUNNER_TEMP/pp-lab/clean.png" "$RUNNER_TEMP/pp-lab/photo.jpg" --out "$RUNNER_TEMP/pp-lab/results"
      - name: Score cell-level text and numeric accuracy without filling missing values
        run: |
          python - <<'PY'
          import os,json,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pp-lab'
          expected=json.loads((root/'expected.json').read_text())
          norm=lambda s:re.sub(r'\s+','',str(s)).lower().replace('.',',')
          def score(result):
              rows=[r for p in result['pages'] for t in p['tables'] for r in t['rows']]
              out={'recognized_rows':len(rows),'expected_product_rows':11,'name':0,'quantity':0,'price':0,'amount':0,'all_fields':0}
              # Compare only rows with a recognized independent ordinal. No value repair.
              for e in expected[1:-1]:
                  matches=[r for r in rows if len(r)==6 and norm(r[0])==norm(e[0])]
                  if len(matches)!=1:continue
                  r=matches[0]
                  checks=[norm(r[i])==norm(e[i]) for i in (1,3,4,5)]
                  for k,v in zip(('name','quantity','price','amount'),checks):out[k]+=int(v)
                  out['all_fields']+=int(all(checks))
              out['seconds']=result['seconds']
              return out
          reports=[]
          for f in sorted((root/'results').glob('*.json')):
              d=json.loads(f.read_text());reports.append({'file':d['file'],'original':score(d['original']),'normalized':score(d['normalized'])})
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          (root/'scores.json').write_text(json.dumps(reports,indent=2))
          assert len(reports)==2
          assert max(reports[1][k]['all_fields'] for k in ('original','normalized'))==11,'All eleven simulated photo rows must match exactly'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppstructure-fictional-photo-results
          path: ${{ runner.temp }}/pp-lab
          retention-days: 7
