name: Supply offline OCR test build
on:
  push:
    branches: [test/supply-offline-ocr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - run: node supply-offline/ocr-draft-parser.test.js
      - run: bash supply-offline/build-android-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FARUKH-SUPPLY-OFFLINE-TEST
          path: supply-offline/build-output/*.apk
          if-no-files-found: error
