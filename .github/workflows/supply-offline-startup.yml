name: Supply offline APK startup QA
on:
  push:
    branches: [test/supply-offline-ocr]
    paths: ['.github/workflows/supply-offline-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash supply-offline/build-android-test.sh
      - run: mkdir -p apk && cp supply-offline/build-output/*.apk apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/FARUKH-SUPPLY-OFFLINE-TEST.apk
            adb shell am start -W -n ai.farukh.supply.offline.test/com.paddle.ocr.demo.MainActivity
            for i in $(seq 1 30); do adb shell uiautomator dump /sdcard/window.xml >/dev/null && adb shell cat /sdcard/window.xml > window.xml; if grep -q 'Сканер загружен' window.xml; then echo 'OFFLINE_MODEL_STARTUP_PASS'; break; fi; if grep -q 'Ошибка загрузки' window.xml; then break; fi; sleep 2; done
            adb logcat -d -t 1500 > startup-log.txt
            grep -q 'Сканер загружен' window.xml
            adb shell dumpsys package ai.farukh.supply.offline.test > package.txt
            ! grep -q 'android.permission.INTERNET' package.txt
      - name: Upload screen dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-startup-screen
          path: |
            window.xml
            startup-log.txt
            package.txt
          if-no-files-found: ignore
