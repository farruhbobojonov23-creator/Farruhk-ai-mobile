name: FARRUH WORKSPACE Browser QA
on:
  workflow_dispatch:
  push:
    branches: [more-sushi-studio-free]
    paths:
      - 'more-sushi-studio-free/mobile.html'
      - 'more-sushi-studio-free/workspace-*.css'
      - 'more-sushi-studio-free/workspace-*.js'
      - 'more-sushi-studio-free/tests/workspace-browser-qa.cjs'
      - '.github/workflows/farruh-workspace-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tooling
        run: |
          npm install --prefix .qa-tool --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          .qa-tool/node_modules/.bin/playwright install --with-deps chromium
      - name: Check actual browser behavior and responsive appearance
        run: NODE_PATH="$PWD/.qa-tool/node_modules" node more-sushi-studio-free/tests/workspace-browser-qa.cjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farruh-workspace-browser-qa
          path: more-sushi-studio-free/tests/qa-results/
          if-no-files-found: warn
