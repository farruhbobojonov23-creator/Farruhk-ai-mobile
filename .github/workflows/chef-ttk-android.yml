name: CHEF TTK PRO — Flutter Android APK
on:
  push:
    branches: [chef-ttk-pro-flutter]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Flutter v0.5 source archive
        run: |
          cat bootstrap/source.b64.part* | base64 --decode > source.tar.xz
          echo "85240b3ef886ff56c513711c9552a5d47f31b79d7cfe4a747e4fdbd14181dad6  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
          test -f lib/main.dart
          test -f pubspec.yaml
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms android --org com.chefttkpro
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart analyzer
        run: flutter analyze
      - name: Run Flutter unit tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEF-TTK-PRO-v0.5-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish unpacked source code to this isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test tool pubspec.yaml analysis_options.yaml .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Unpack CHEF TTK PRO v0.5 source code"
            git push origin HEAD:chef-ttk-pro-flutter
          fi
