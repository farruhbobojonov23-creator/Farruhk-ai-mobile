name: CHEF TTK PRO v0.6.1 — Parallel Install
on:
  push:
    branches: [chef-ttk-pro-side-by-side-v06]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CHEF TTK PRO v0.6 patch and verify checksum
        run: |
          cat bootstrap/v06.patch.part* | base64 --decode > v06.patch.tar.xz
          echo 'a86bafeef0664d4e4d65184c06983cba29be72632da009f86014c4465a8c2d16  v06.patch.tar.xz' | sha256sum -c -
          tar -xJf v06.patch.tar.xz
          sed -i '46,47d' lib/services/ttk_pdf.dart  # drop unused local helper; keep warnings fatal
          sed -i 's/height: 94)/height: 105)/g; s/height: 12.8,/height: 11.8,/g' lib/services/ttk_pdf.dart  # preserve all four KBJU rows
          test -f lib/services/ttk_pdf.dart
          test -f test/ttk_pdf_test.dart
          sed -i 's/version: 0.6.0+6/version: 0.6.1+7/' pubspec.yaml
      - name: Download open-source Noto Sans fonts for offline PDF
        run: |
          mkdir -p assets/pdf
          curl --retry 3 -fLsS -o assets/pdf/NotoSans-Regular.ttf https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf
          curl --retry 3 -fLsS -o assets/pdf/NotoSans-Bold.ttf https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf
          test $(wc -c < assets/pdf/NotoSans-Regular.ttf) -gt 100000
          test $(wc -c < assets/pdf/NotoSans-Bold.ttf) -gt 100000
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform without template tests
        run: |
          flutter create . --platforms android --org com.chefttkpro
          rm -f test/widget_test.dart
          # This is a side-by-side install that cannot overwrite v0.5 user data.
          sed -Ei 's/(applicationId[[:space:]]*=[[:space:]]*")[^"]+(")/\1com.chefttkpro.chef_ttk_pro.preview\2/' android/app/build.gradle.kts
          grep -F 'applicationId = "com.chefttkpro.chef_ttk_pro.preview"' android/app/build.gradle.kts
          sed -i 's/android:label="chef_ttk_pro"/android:label="CHEF TTK PRO Preview"/' android/app/src/main/AndroidManifest.xml
          grep -F 'android:label="CHEF TTK PRO Preview"' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart analyzer
        run: flutter analyze --no-fatal-infos
      - name: Run all tests and render approved A4 PDF
        run: flutter test
      - name: Verify sample PDF is exactly one A4 page and contains 9 sections
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdfinfo build/ttk_pdf_preview/philadelphia_a4.pdf
          pdfinfo build/ttk_pdf_preview/philadelphia_a4.pdf | grep -E '^Pages:[[:space:]]+1$'
          pdftotext -layout build/ttk_pdf_preview/philadelphia_a4.pdf sample.txt
          grep -F 'ТЕХНОЛОГИЧЕСКАЯ КАРТА' sample.txt
          grep -F 'АЛЛЕРГЕНЫ В БЛЮДЕ' sample.txt
          grep -F 'БЕЗОПАСНОСТЬ' sample.txt
          grep -F 'Ккал' sample.txt
      - name: Upload printable A4 PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: CHEF-TTK-PRO-v0.6.1-PREVIEW-A4-PDF
          path: build/ttk_pdf_preview/philadelphia_a4.pdf
          if-no-files-found: error
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEF-TTK-PRO-v0.6.1-PREVIEW-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
