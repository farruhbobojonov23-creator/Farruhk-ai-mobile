name: Workspace Android WebView check
on:
  push:
    branches: [qa/workspace-1.9.1-android]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the Workspace APK
        working-directory: farruh-workspace-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Give runner access to KVM
        run: sudo setfacl -m u:"$(id -un)":rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: python3 qa-workspace-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workspace-Android-screens
          path: qa-android-output
          retention-days: 7
