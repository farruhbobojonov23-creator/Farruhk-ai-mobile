name: FARUKH TTK PRO APK
on:
  workflow_dispatch:
  push:
    branches: [farukh-ttk-pro]
    paths:
      - 'farukh-ttk-pro/**'
      - '.github/workflows/farukh-ttk-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farukh-ttk-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted ubuntu-latest already contains the Android SDK.
      # android-actions/setup-android@v3 tries to install the removed
      # legacy package 'tools' and fails before Gradle can start.
      - name: Confirm Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed offline sushi photography
        run: bash embed-food-photos.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FARUKH-TTK-PRO-debug-apk
          path: farukh-ttk-pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
