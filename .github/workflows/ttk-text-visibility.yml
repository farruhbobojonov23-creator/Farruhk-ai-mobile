name: FARRUH AI — TTK Text Visibility Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Deep audit of all four TTKs
        run: node tests/ttk-visibility-audit.mjs
      - name: Upload screenshots and measured clipping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttk-text-visibility-audit
          path: |
            artifacts/ttk-audit-*.png
            artifacts/ttk-visibility-audit.json
          if-no-files-found: ignore
