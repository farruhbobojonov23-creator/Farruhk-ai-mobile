name: PP-StructureV3 import beta QA
on:
  push:
    branches: ['experiment/supply-structure-import']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check supply-android/app/src/main/assets/app.js
      - run: node --test supply/structure-import.test.cjs supply/smart-simple.test.cjs supply/invoice-parser.test.js supply/analytics.test.js supply/product-catalog.test.js supply/table-core.test.js
