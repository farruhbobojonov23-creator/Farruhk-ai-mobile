name: Android FARUKH PRINT APK
on:
  push:
    branches: [main]
    paths:
      - 'android/print/**'
      - 'tests/print-fast-pro-reliability.test.js'
      - 'tests/print-native-diagnostics.test.js'
      - 'tests/print-stable-release.test.js'
      - '.github/workflows/farukh-print-apk.yml'
  pull_request:
    paths:
      - 'android/print/**'
      - 'tests/print-fast-pro-reliability.test.js'
      - 'tests/print-native-diagnostics.test.js'
      - 'tests/print-stable-release.test.js'
      - '.github/workflows/farukh-print-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FARUKH PRINT critical functions
        run: |
          node --test tests/print-fast-pro-reliability.test.js tests/print-native-diagnostics.test.js tests/print-pro-scanner-batch.test.js tests/print-pro-owner-report.test.js tests/print-premium-fast.test.js tests/print-premium-v2-home.test.js tests/print-stable-release.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            mkdir -p /tmp/androidcmd
            unzip -q /tmp/android-tools.zip -d /tmp/androidcmd
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -R /tmp/androidcmd/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Prepare writable Android user and debug keystore dirs
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config/.android" || true
          mkdir -p "$RUNNER_TEMP/android-user-home"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home" >> "$GITHUB_ENV"
      - name: Build debug APK for TESTING ONLY (never publish as an update)
        working-directory: android
        run: gradle :print:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FARUKH-PRINT-Android-test
          path: android/print/build/outputs/apk/debug/print-debug.apk
          if-no-files-found: error
      # GitHub Secrets must be configured ONCE by the repository owner.
      # Without a persistent keystore, each GitHub hosted runner may sign with
      # a different debug key and Android rightly refuses in-place updates.
      - name: Check stable release signing secrets
        id: release-signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          STORE_B64: ${{ secrets.FARUKH_PRINT_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FARUKH_PRINT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FARUKH_PRINT_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FARUKH_PRINT_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are missing. Keeping the previous public APK; a debug APK must NOT replace it."
          fi
      - name: Build and publish ONE consistently signed FARUKH PRINT update
        if: steps.release-signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STORE_B64: ${{ secrets.FARUKH_PRINT_KEYSTORE_BASE64 }}
          FARUKH_PRINT_SIGNING_STORE_PASSWORD: ${{ secrets.FARUKH_PRINT_SIGNING_STORE_PASSWORD }}
          FARUKH_PRINT_SIGNING_KEY_ALIAS: ${{ secrets.FARUKH_PRINT_SIGNING_KEY_ALIAS }}
          FARUKH_PRINT_SIGNING_KEY_PASSWORD: ${{ secrets.FARUKH_PRINT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/farukh-print-release.jks"
          printf '%s' "$STORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export FARUKH_PRINT_SIGNING_STORE_FILE="$KEYSTORE"
          (cd android && gradle :print:assembleRelease --no-daemon --stacktrace)
          mkdir -p "$RUNNER_TEMP/farukh-release"
          APK="$RUNNER_TEMP/farukh-release/FARUKH-PRINT-test.apk"
          cp android/print/build/outputs/apk/release/print-release.apk "$APK"
          CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9]\+\).*/\1/p' android/print/build.gradle | head -1)"
          NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/print/build.gradle | head -1)"
          HASH="$(sha256sum "$APK" | cut -d' ' -f1)"
          # Protect a published stable release against accidental key replacement.
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$FARUKH_PRINT_SIGNING_STORE_PASSWORD" -alias "$FARUKH_PRINT_SIGNING_KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Cannot identify signing certificate"
            exit 1
          fi
          printf 'FARUKH_PRINT_VERSION_CODE=%s\nFARUKH_PRINT_VERSION_NAME=%s\nFARUKH_PRINT_SHA256=%s\nFARUKH_PRINT_CERT_SHA256=%s\n\nAndroid checks the existing application signature and asks before installation. Earlier debug-signed versions need a one-time migration after backing up JSON.\n' "$CODE" "$NAME" "$HASH" "$CERT_SHA256" > "$RUNNER_TEMP/farukh-release/notes.txt"
          if gh release view farukh-print-current --repo "$GH_REPO" >/dev/null 2>&1; then
            EXISTING_CERT="$(gh release view farukh-print-current --repo "$GH_REPO" --json body --jq '.body' | sed -n 's/^FARUKH_PRINT_CERT_SHA256=//p' | head -1)"
            if [ -n "$EXISTING_CERT" ] && [ "$EXISTING_CERT" != "$CERT_SHA256" ]; then
              echo "::error::Signing key changed. Refusing to overwrite previously signed APK."
              exit 1
            fi
            EXISTING_CODE="$(gh release view farukh-print-current --repo "$GH_REPO" --json body --jq '.body' | grep -E '^FARUKH_PRINT_VERSION_CODE=[0-9]+$' | head -1 | cut -d= -f2 || true)"
            EXISTING_ASSET="$(gh release view farukh-print-current --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fx 'FARUKH-PRINT-test.apk' || true)"
            if [ "$EXISTING_CODE" = "$CODE" ] && [ -n "$EXISTING_ASSET" ]; then
              echo "Published APK versionCode $CODE already exists; keeping original signed binary."
              exit 0
            fi
            gh release upload farukh-print-current "$APK" --clobber --repo "$GH_REPO"
            gh release edit farukh-print-current --title "FARUKH PRINT — версия $NAME" --notes-file "$RUNNER_TEMP/farukh-release/notes.txt" --repo "$GH_REPO"
          else
            gh release create farukh-print-current "$APK" --target "$GITHUB_SHA" --title "FARUKH PRINT — версия $NAME" --notes-file "$RUNNER_TEMP/farukh-release/notes.txt" --prerelease --repo "$GH_REPO"
          fi
          rm -f "$KEYSTORE"
