name: FARUKH AI — Stark V4 QA
on:
  push:
    branches:
      - redesign/premium-stark-v4
      - fix/stark-v4-mobile-performance
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact project dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript syntax
        run: |
          node --check public/stark-showroom.js
          node --check public/recipe-google.js
          node --check public/recipe-actions.js
          node --check public/haccp-ui.js
      - name: Run project regression suite
        run: npm test
      # Stark is a retired prototype on main; its 3D interaction smoke is
      # only relevant on the two Stark development branches.
      # Active production Titanium/Crystal/Royal themes are tested independently
      # on pull requests by premium-qa-20261112.yml.
      - name: Install browser QA dependencies
        if: github.event_name == 'push'
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Stark prototype interactions in Chromium desktop and mobile
        if: github.event_name == 'push'
        run: node tests/stark-browser-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stark-v4-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
