name: Compact 30-60 MB mobile OCR QA (isolated)
on:
  push:
    branches: ['experiment/supply-ppstructure-v3']
    paths:
      - 'supply/experimental/compact-photo.mjs'
      - '.github/workflows/supply-compact-scan-qa.yml'
permissions:
  contents: read
jobs:
  compact-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools and acquire table weights
        run: |
          mkdir -p "$RUNNER_TEMP/compact"
          cp supply/smart-scan-{models,layout,engine}.mjs supply/experimental/compact-photo.mjs "$RUNNER_TEMP/compact/"
          cd "$RUNNER_TEMP/compact"
          npm init -y
          npm install --no-audit --no-fund playwright yaml
          npx playwright install chromium
          for file in inference.onnx inference.yml; do
            curl -fL --retry 2 --max-time 120 "https://huggingface.co/PaddlePaddle/SLANet_plus_onnx/resolve/main/$file" -o "table-$file"
          done
          sha256sum table-inference.*
      - name: Run real inference with local WASM and compare exact table contents
        run: |
          cd "$RUNNER_TEMP/compact"
          cat > test.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';
          import {parse} from 'yaml';
          import {MODEL_PACK,MODEL_PACK_BYTES} from './smart-scan-models.mjs';
          const yaml=parse(fs.readFileSync('table-inference.yml','utf8')),raw=yaml.PostProcess.character_dict;
          const dict=['sos',...raw.filter(x=>x!=='<td>'),'<td></td>','eos'];
          const bytes=MODEL_PACK_BYTES+fs.statSync('table-inference.onnx').size+fs.statSync('table-inference.yml').size;
          console.log('Compact download bytes:',bytes);
          assert.ok(bytes>=30e6&&bytes<=60e6,'Outside agreed download budget');
          for(const [name,model] of Object.entries(MODEL_PACK)){
            const r=await fetch(model.url);assert.ok(r.ok,name);
            const b=Buffer.from(await r.arrayBuffer());
            assert.equal(b.length,model.size);assert.equal(createHash('sha256').update(b).digest('hex'),model.sha256);
            fs.writeFileSync(name,b);
          }
          const server=http.createServer((req,res)=>{
            const f=req.url.slice(1);
            if(!f){res.setHeader('content-type','text/html');return res.end('<!doctype html><meta charset="utf-8">')}
            if(!/^[a-zA-Z0-9._-]+$/.test(f)||!fs.existsSync(f)){res.statusCode=404;return res.end();}
            res.setHeader('content-type',f.endsWith('.mjs')?'text/javascript':f.endsWith('.wasm')?'application/wasm':'application/octet-stream');
            fs.createReadStream(f).pipe(res);
          });
          await new Promise(r=>server.listen(4173,'127.0.0.1',r));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            await page.route('**/*',r=>new URL(r.request().url()).origin==='http://127.0.0.1:4173'||r.request().url().startsWith('blob:')?r.continue():r.abort());
            await page.goto('http://127.0.0.1:4173');
            const result=await page.evaluate(async dict=>{
              const m=await import('/smart-scan-models.mjs'),e=await import('/smart-scan-engine.mjs'),c=await import('/compact-photo.mjs');
              const pack=await m.readModelPack({fetchAsset:n=>fetch('/'+n)}),s=await m.openModelSessions(pack);
              const table=await s.ort.InferenceSession.create(new Uint8Array(await(await fetch('/table-inference.onnx')).arrayBuffer()),{executionProviders:['wasm']});
              try{
                const cv=document.createElement('canvas');cv.width=1240;cv.height=600;
                const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1240,600);
                const xs=[20,80,610,700,860,1040,1220],ys=Array.from({length:7},(_,i)=>20+85*i);
                const rows=[['№','Наименование товара','Ед.','Кол-во','Цена с НДС','Сумма'],['1','Рис 25 кг','шт','3','2700,00','8100,00'],['2','Сыр 400 г','шт','12','251,90','3022,80'],['3','Мука 5 кг','шт','2','124,50','249,00'],['4','Соус 1 л','шт','8','197,32','1578,56'],['','Итого','','','','12950,36']];
                ctx.strokeStyle='black';ctx.lineWidth=2;for(const x of xs){ctx.beginPath();ctx.moveTo(x,ys[0]);ctx.lineTo(x,ys.at(-1));ctx.stroke();}
                for(const y of ys){ctx.beginPath();ctx.moveTo(xs[0],y);ctx.lineTo(xs.at(-1),y);ctx.stroke();}
                ctx.fillStyle='black';ctx.font='25px Arial';rows.forEach((row,i)=>row.forEach((v,j)=>ctx.fillText(v,xs[j]+7,ys[i]+50)));
                const im=ctx.getImageData(0,0,cv.width,cv.height);
                for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){const k=(y*im.width+x)*4,f=1-.5*Math.exp(-((x/im.width-.6)**2/.02+(y/im.height-.7)**2/.08));for(let j=0;j<3;j++)im.data[k+j]*=f;}
                const fixed=c.normalizePaper(im),tensor=c.tableInput(fixed);
                const outputs=await table.run({[table.inputNames[0]]:new s.ort.Tensor('float32',tensor,[1,3,488,488])});
                const shapes=Object.fromEntries(Object.entries(outputs).map(([k,v])=>[k,v.dims]));
                // Actual output dictates the exact dictionary; no fabricated rows.
                let decoded;
                for(const d of [dict,dict.filter(t=>t!=='<td></td>'),dict.map(t=>t==='<td></td>'?'<td>':t)]){
                  try{decoded=c.decodeStructure(outputs,d);break}catch{}
                }
                if(!decoded)throw Error('SLANet dictionary mismatch '+JSON.stringify(shapes));
                const o=await e.scanRaster(fixed,{sessions:{...s,chars:e.dictionary(s.dictionaryYaml)},offline:true});
                const raw=o.items.map(i=>i.text).join(' ');
                const grid=c.ruledGrid(fixed),assigned=grid?c.assignGridText(grid,o.items):null;
                const verified=grid?await c.verifyGridCells(fixed,grid,assigned,{...s,chars:e.dictionary(s.dictionaryYaml)}):null;
                return {decoded,shapes,raw,grid,assigned,verified,seconds:o.seconds,expected:rows.slice(1,-1)};
              }finally{await table.release();await s.dispose();}
            },dict);
            console.log(JSON.stringify(result));
            assert.ok(result.grid,'Independent ruled grid not detected');
            assert.equal(result.grid.rows,6,'Wrong number of ruled rows');
            assert.equal(result.grid.cols,6,'Wrong number of ruled columns');
            assert.equal(result.assigned.ambiguous,0,'Text crosses cell borders');
            const norm=s=>s.toLowerCase().replace(/\s/g,'').replace(/\./g,',');
            const numeric=(s)=>/^\d+(?:[,.]\d+)?$/.test(s.replace(/\s/g,''))?Number(s.replace(/\s/g,'').replace(',','.')):NaN;
            assert.ok(result.verified,'No independent cell readings');
            const cells=result.verified.rows.slice(1,-1);
            let exactNames=0;
            for(let i=0;i<result.expected.length;i++){
              const wanted=result.expected[i],actual=cells[i];
              exactNames+=Number(norm(actual[1])===norm(wanted[1]));
              for(const j of [3,4,5])assert.equal(numeric(actual[j]),numeric(wanted[j]),'Numeric cell mismatch at '+i+','+j);
            }
            console.log('SLANet predicted rows:',result.decoded.rows,'independent grid:',result.grid.rows,'exact names:',exactNames,'/',result.expected.length);
            assert.equal(exactNames,result.expected.length,'Product names must also match exactly');
            assert.equal(result.verified.verified,true,JSON.stringify(result.verified.review));
          }finally{await browser.close();server.close();}
          EOF
          node test.mjs
