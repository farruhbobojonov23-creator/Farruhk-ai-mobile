name: Build Workspace toolbar update
on:
  push:
    branches: [workspace-project-toolbar-1.3.5]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p farruh-workspace-android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-1.3.5-unsigned
          path: farruh-workspace-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
