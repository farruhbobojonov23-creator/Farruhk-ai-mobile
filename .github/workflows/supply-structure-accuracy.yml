name: PP-StructureV3 exact invoice accuracy (isolated)
on:
  push:
    branches: ['experiment/supply-local-vision-benchmark']
    paths: ['.github/workflows/supply-structure-accuracy.yml']
permissions:
  contents: read
  actions: read
jobs:
  accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OCR-report-structure
          run-id: 45953636991
          github-token: ${{ github.token }}
          path: results
      - name: Compare actual recognized cells and totals with ground truth
        run: |
          python3 - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          from decimal import Decimal,InvalidOperation
          from html.parser import HTMLParser
          class Cells(HTMLParser):
              def __init__(self):
                  super().__init__();self.rows=[];self.row=None;self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=='tr':self.row=[]
                  if tag in ('td','th'):self.cell=[]
              def handle_data(self,data):
                  if self.cell is not None:self.cell.append(data)
              def handle_endtag(self,tag):
                  if tag in ('td','th') and self.cell is not None:
                      if self.row is not None:self.row.append(' '.join(''.join(self.cell).split()))
                      self.cell=None
                  if tag=='tr' and self.row is not None:self.rows.append(self.row);self.row=None
          root=Path('results'); expected=json.loads((root/'expected.json').read_text()); timing=json.loads((root/'report.json').read_text())
          def norm(s):return re.sub(r'\s+','',unicodedata.normalize('NFKC',str(s))).casefold()
          def num(s):
              try:
                  n=Decimal(re.sub(r'\s+','',str(s)).replace(',','.'))
                  return n if n.is_finite() else None
              except InvalidOperation:return None
          report={'engine':'PP-StructureV3 / Cyrillic PP-OCRv5','scope':'synthetic invoices, CPU, not Android','pages':[]}
          for page,exp in expected.items():
              grids=[];texts=[]
              for f in sorted((root/page).rglob('*.json')):
                  raw=json.loads(f.read_text());raw=raw.get('res',raw)
                  for t in raw.get('table_res_list',[]):
                      parser=Cells();parser.feed(t.get('pred_html',''));grids.append(parser.rows)
                  texts.extend(raw.get('overall_ocr_res',{}).get('rec_texts',[]))
              rows=[r for g in grids for r in g if len(r)==5 and all(num(r[j]) is not None for j in (2,3,4))]
              used=set();names=numeric=exact=0
              for e in exp['rows']:
                  found=[(i,r) for i,r in enumerate(rows) if i not in used and norm(r[0])==norm(e[0])]
                  if not found:continue
                  i,r=found[0];used.add(i);names+=1
                  if all(num(r[j])==num(e[j]) for j in (2,3,4)):
                      numeric+=1
                      if norm(r[1])==norm(e[1]):exact+=1
              printed=[num(r[-1]) for g in grids for r in g if len(r)>=2 and norm(r[0]).startswith('итого')]
              text=' '.join(texts)
              entry={'page':page,'expected':len(exp['rows']),'detected_numeric_rows':len(rows),'correct_names':names,'correct_names_and_numbers':numeric,'exact_rows':exact,'printed_total_ok':len(printed)==1 and printed[0]==num(exp['total']),'line_math_ok':bool(rows) and all(num(r[2])*num(r[3])==num(r[4]) for r in rows),'sum_ok':sum((num(r[4]) for r in rows),Decimal(0))==num(exp['total']),'supplier_seen':norm('ООО Учебный') in norm(text),'number_seen':'8049' in text,'date_seen':'09.11.2026' in text,'seconds':next((x['seconds'] for x in timing['pages'] if x['page']==page),None),'grids':grids}
              report['pages'].append(entry)
              print(json.dumps({k:v for k,v in entry.items() if k!='grids'},ensure_ascii=False))
          report['passed']=all(p['exact_rows']==p['expected']==p['detected_numeric_rows'] and p['printed_total_ok'] and p['line_math_ok'] and p['sum_ok'] and p['supplier_seen'] and p['number_seen'] and p['date_seen'] for p in report['pages'])
          Path('accuracy.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('ACCURACY_GATE',report['passed'])
          if not report['passed']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-accuracy-report
          path: accuracy.json
