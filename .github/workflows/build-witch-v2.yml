name: Build Witch APK v2

on:
  push:
    branches: [android-witch-v2]
    paths:
      - 'android-witch/**'
      - '.github/workflows/build-witch-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p android-witch assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-witch/app/build/outputs/apk/debug/app-debug.apk Farrukh_AI_Witch_V2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Farrukh_AI_Witch_V2
          path: Farrukh_AI_Witch_V2.apk
          if-no-files-found: error
