name: Build Witch APK v2

on:
  push:
    branches: [android-witch-v2]
    paths:
      - 'android-witch/**'
      - '.github/workflows/build-witch-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p android-witch assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-witch/app/build/outputs/apk/debug/app-debug.apk Farrukh_AI_Witch_V2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Farrukh_AI_Witch_V2
          path: Farrukh_AI_Witch_V2.apk
          if-no-files-found: error
