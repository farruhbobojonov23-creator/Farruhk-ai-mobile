<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FARUKH SUPPLY AI</title><style>
*{box-sizing:border-box} :root{--ink:#182141;--muted:#65718c;--line:#e3e7f5;--purple:#6545e9;--green:#08783d;--red:#bd253a} body{margin:0;background:radial-gradient(ellipse at 100% 0,#e4e2ff,transparent 55%),#f5f6fb;color:var(--ink);font:15px system-ui,sans-serif} main{max-width:740px;margin:auto;padding:12px 15px 110px} header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0;background:#f6f6fbee;backdrop-filter:blur(12px)} .logo{display:grid;place-items:center;width:42px;height:42px;flex:none;color:#fff;background:linear-gradient(145deg,#19b9fe,#4b47eb 60%,#ad43f1);border-radius:13px;font-size:28px;font-weight:900;font-style:italic;box-shadow:0 4px 10px #6c58dd40}.brand{font-size:clamp(14px,4vw,22px);font-weight:900;letter-spacing:-.5px}.brand b{color:var(--purple)} small,.muted{color:var(--muted)} .update{margin-left:auto;flex:none;font-size:12px;text-decoration:none;color:#4631ba;border:1px solid #deddf5;border-radius:12px;padding:10px;background:#fff} h1{font-size:25px;letter-spacing:-.7px;margin:16px 0 12px}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 7px 25px #303d7210}.hero{background:linear-gradient(130deg,#fff,#edf0ff);padding:20px;overflow:hidden}.hero h1{margin:0 0 14px}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#f7f7fd;border-radius:12px;padding:12px 14px;font-weight:700;min-height:44px}button:disabled{opacity:.5;cursor:default}.primary{color:white;background:linear-gradient(115deg,#9145ef,#4149e9);border:0;box-shadow:0 6px 16px #6249ed32;width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{margin:0}.metric{font-size:26px;font-weight:850;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row>div{min-width:0;overflow-wrap:anywhere}.price{white-space:nowrap;font-weight:800}.down{color:var(--green)}.up{color:var(--red)}.nav{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 6px;background:#ffffffed;backdrop-filter:blur(16px);box-shadow:0 -4px 24px #333d7015;border-top:1px solid var(--line)}.nav button{flex:1;max-width:145px;min-width:0;padding:8px 2px;font-size:10px;background:none;border:none;color:#56617c}.nav .active{background:#eeeaff;color:#5330ce}.icon{display:block;font-size:23px;line-height:1.3}.hide{display:none!important}label{display:grid;gap:5px;color:var(--muted);font-size:13px;margin:8px 0}input{width:100%;min-width:0;background:#f9faff;border:1px solid #dce1ee;border-radius:10px;padding:11px 9px;font-size:16px}input:focus{outline:2px solid #9e8df8} .file{position:relative;display:block;color:white;text-align:center;margin:0;overflow:hidden;font-size:16px;padding:16px;border-radius:15px}.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}.line{display:grid;grid-template-columns:minmax(0,1fr) 98px 38px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.line input{font-size:14px}.line button{padding:0;min-height:40px;color:#9c3246}.uncertain{background:#fff8dd;border-radius:8px}.preview{max-height:150px;max-width:100%;object-fit:contain;display:block;margin:10px auto;border-radius:10px}#status:not(:empty){padding:10px 12px;border-radius:12px;background:#fff3d9;color:#704b00}#status.ok{background:#e7f8ed;color:#08783d}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:7px;background:#eeeaff;color:#5939c9}.empty{padding:12px 0;color:var(--muted)}@media(max-width:360px){main{padding-left:10px;padding-right:10px}.card{padding:12px}.line{grid-template-columns:minmax(0,1fr) 86px 34px}.nav button{font-size:9px}}
#lines .line{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:12px 8px;align-items:end;margin-bottom:8px}#lines .line label{margin:0;min-width:0}#lines .line label:first-child{grid-column:1/-1;padding-right:42px}#lines .line{position:relative}#lines .line-delete{position:absolute;right:8px;top:28px;width:34px}#lines select{width:100%;min-width:0;font:inherit;padding:11px 8px;border:1px solid #dce1ee;background:#f9faff;border-radius:10px;color:var(--ink);font-size:14px}#lines input:disabled{opacity:.45}.line-summary{grid-column:1/-1;color:#4536a6;font-size:13px;font-weight:700;overflow-wrap:anywhere}.line-summary:empty{display:none}
</style></head><body><main><header><div class="logo">F</div><div><div class="brand">FARUKH <b>SUPPLY AI</b></div><small>Цены и поставщики</small></div><a class="update" href="https://appassets.androidplatform.net/update">↻ Обновить</a></header><p id="status" role="status"></p>
<section id="home"><div class="card hero"><h1>Контроль закупочных цен</h1><button class="primary" data-go="entry">▣ Загрузить накладную</button></div><div class="grid"><div class="card"><small>Товаров в базе</small><div id="productCount" class="metric">0</div></div><div class="card"><small>Поставщиков</small><div id="supplierCount" class="metric">0</div></div></div><div class="card"><h2>Изменения цен</h2><div id="changes"></div></div><div class="card"><h2>Последние накладные</h2><div id="recent"></div></div></section>
<section id="entry" class="hide"><h1>Новая накладная</h1><form id="form"><div class="card"><label class="file primary">▣ Выбрать фото накладной<input type="file" id="file" accept="image/*" aria-label="Выбрать фото накладной"></label><img id="preview" class="preview hide" alt="Фото накладной"><p id="ocrState" role="status"></p><div id="retry" class="controls hide"><button type="button" id="rescan">Повторить распознавание</button></div><label>Поставщик<input id="supplier" required placeholder="Название поставщика"></label></div><div class="card"><h2>Товары и цены</h2><div id="lines"></div><div class="controls"><button type="button" id="addLine">＋ Товар</button></div></div><button type="submit" id="save" class="primary">✓ Проверить и сохранить</button></form></section>
<section id="invoices" class="hide"><h1>Накладные</h1><button class="primary" data-go="entry">＋ Загрузить накладную</button><div id="archive"></div></section>
<section id="products" class="hide"><h1>Товары</h1><label>Поиск<input id="search" placeholder="Название товара"></label><div id="productList"></div></section>
<section id="suppliers" class="hide"><h1>Поставщики</h1><div id="supplierList"></div></section>
<section id="compare" class="hide"><h1>Сравнение цен</h1><div id="offers"></div></section>
</main><nav class="nav" aria-label="Разделы"><button data-go="home" class="active"><span class="icon">⌂</span>Главная</button><button data-go="invoices"><span class="icon">▤</span>Накладные</button><button data-go="products"><span class="icon">▦</span>Товары</button><button data-go="suppliers"><span class="icon">♧</span>Поставщики</button><button data-go="compare"><span class="icon">⇄</span>Сравнение</button></nav><script src="analytics.js"></script><script src="invoice-parser.js"></script><script src="app.js"></script></body></html>
